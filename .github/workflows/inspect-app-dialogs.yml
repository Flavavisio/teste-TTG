name: Inspect app dialogs block

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear diálogos inline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('app.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          needles = [
              'function tgAlert',
              'function tgConfirm',
              'function tgPrompt',
              'function tgEscolher',
              '_tgAlertFila',
              'tgAlertOverlay',
              'tgAlertBtnCancelar',
              'tgAlertBtnOk'
          ]

          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {len(hits)} hit(s) =====')
              for i in hits:
                  lo = max(0, i - 22)
                  hi = min(len(lines), i + 34)
                  print(f'--- context lines {lo+1}-{hi} (hit {i+1}) ---')
                  for n in range(lo, hi):
                      print(f'{n+1:06d}: {lines[n]}')

          defs = [i for i,l in enumerate(lines) if 'function tgAlert' in l or 'function tgConfirm' in l or 'function tgPrompt' in l or 'function tgEscolher' in l]
          if defs:
              first, last = min(defs), max(defs)
              prev_script = max((i for i in range(first, -1, -1) if '<script' in lines[i]), default=None)
              next_script = next((i for i in range(last, len(lines)) if '</script>' in lines[i]), None)
              print('\n===== script boundaries =====')
              print('first_def=', first+1, 'last_def=', last+1)
              print('prev_script_line=', None if prev_script is None else prev_script+1)
              print('next_script_line=', None if next_script is None else next_script+1)
              if prev_script is not None:
                  print('\n===== script start context =====')
                  for n in range(prev_script, min(prev_script+45, len(lines))):
                      print(f'{n+1:06d}: {lines[n]}')
              if next_script is not None:
                  print('\n===== script end context =====')
                  for n in range(max(0,next_script-45), next_script+1):
                      print(f'{n+1:06d}: {lines[n]}')
          PY
