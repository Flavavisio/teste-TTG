name: Inspect services round 8

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mostrar renderizarServicos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          marker = '        function renderizarServicos() {'
          start = text.index(marker)
          end = text.index('\n        function ', start + len(marker))
          block = text[start:end]
          print('BEGIN_RENDERIZAR_SERVICOS')
          print(block)
          print('END_RENDERIZAR_SERVICOS')
          print('CHARS=', len(block))
          print('LINES=', len(block.splitlines()))
          PY
