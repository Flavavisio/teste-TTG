name: Inspect services round 8

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar âncoras do módulo de ponto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          for needle in [
              '<script src="assets/js/app-services-view.js"></script>',
              '<script src="./assets/js/app-services-view.js"></script>',
              '_inicioSemana()',
              '_fmtH(',
              'renderizarResumoPontoAdmin()'
          ]:
              print(repr(needle), 'COUNT=', text.count(needle))
          for line in text.splitlines():
              if 'app-services-view.js' in line or 'app-services-selection.js' in line:
                  print('SCRIPT_LINE=', line)
          PY
