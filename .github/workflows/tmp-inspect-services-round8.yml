name: Inspect services round 8

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar helpers seguros de ponto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          names = ['_inicioSemana', '_fmtH', 'renderizarResumoPontoAdmin']
          for name in names:
              marker = f'        function {name}('
              start = text.index(marker)
              end = text.find('\n        function ', start + len(marker))
              if end < 0: end = len(text)
              print(f'BEGIN_{name}')
              print(text[start:end])
              print(f'END_{name}')
          PY
