name: Replace inline PWA safely

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-pwa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 0

      - name: Substituir bloco PWA inline pelo módulo
        shell: bash
        run: |
          set -euo pipefail
          atual="$(git hash-object app.html)"
          esperado="50c689b087f0070b9c7faa88d62b294b22f3c6fd"
          if [ "$atual" != "$esperado" ]; then
            echo "app.html mudou: $atual (esperado $esperado). A abortar."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.html')
          data = path.read_bytes()
          newline = b'\r\n' if data.count(b'\r\n') > data.count(b'\n') / 2 else b'\n'

          markers = [
              b'// PWA: registo do service worker',
              b'navigator.serviceWorker.register',
              b"reg.addEventListener('updatefound'",
              b'function _mostrarAvisoNovaVersao()',
              b'async function _atualizarParaNovaVersao()',
              b"window.addEventListener('beforeinstallprompt'",
              b'function _pwaBannerFoiDispensadoRecentemente()',
              b'function instalarPWA()',
              b"window.addEventListener('appinstalled'"
          ]

          for marker in markers:
              if data.count(marker) != 1:
                  raise SystemExit(f'marcador inesperado {marker!r}: {data.count(marker)} ocorrência(s)')

          anchor = data.index(markers[0])
          start = data.rfind(b'<script', 0, anchor)
          end_tag = data.find(b'</script>', anchor)
          if start < 0 or end_tag < 0:
              raise SystemExit('não foi possível isolar o script PWA')
          end = end_tag + len(b'</script>')
          bloco = data[start:end]

          if bloco.count(b'<script') != 1 or bloco.count(b'</script>') != 1:
              raise SystemExit('o candidato PWA não é um script autónomo')
          for marker in markers:
              if marker not in bloco:
                  raise SystemExit(f'marcador PWA fora do bloco: {marker!r}')
          if not (2_000 < len(bloco) < 20_000):
              raise SystemExit(f'tamanho inesperado do bloco PWA: {len(bloco)} bytes')

          # Remove só o script; mantém o HTML do banner de instalação.
          before = data[:start]
          after = data[end:]
          if before.endswith(newline) and after.startswith(newline):
              after = after[len(newline):]
          data = before + after

          shell = b'<script src="./assets/js/app-shell.js"></script>'
          init = b'<script>window.TotalGestApp.init({ pwa: true, dialogs: false, bootstrap: false });</script>'
          if data.count(shell) != 1:
              raise SystemExit(f'app-shell inesperado: {data.count(shell)} ocorrência(s)')
          if init in data:
              raise SystemExit('init seletivo já existe')
          data = data.replace(shell, shell + newline + b'  ' + init, 1)

          path.write_bytes(data)
          PY

          git diff --check -- app.html
          for needle in 'serviceWorker.register' 'beforeinstallprompt' 'appinstalled' '_pwaBannerFoiDispensadoRecentemente'; do
            if grep -q "$needle" app.html; then
              echo "Ainda existe marcador PWA inline: $needle"
              exit 1
            fi
          done
          grep -q 'TotalGestApp.init({ pwa: true, dialogs: false, bootstrap: false })' app.html
          removed="$(git diff --numstat -- app.html | awk '{print $2}')"
          added="$(git diff --numstat -- app.html | awk '{print $1}')"
          test "$removed" -ge 80
          test "$removed" -le 100
          test "$added" -le 2

      - name: Gravar substituição PWA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Substituir PWA inline pelo módulo externo"
          git push origin HEAD:refactor/separar-index-app
