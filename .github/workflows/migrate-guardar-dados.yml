name: Migrate guardarDados

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - run: python3 .github/scripts/migrate-guardar-dados.py
      - run: node --check assets/js/app-save-queue.js
      - run: node --check assets/js/app-shell.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/migrate-guardar-dados.py
          git add app.html assets/js/app-shell.js assets/js/app-save-queue.js sw.js .github/scripts/migrate-guardar-dados.py
          git diff --cached --check
          git commit -m "Extrair fila de guardarDados"
          git push origin HEAD:refactor/separar-index-app
