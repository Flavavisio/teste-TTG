name: Replace inline bootstrap safely

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 1

      - name: Substituir bootstrap inline pelo módulo externo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.html')
          data = path.read_bytes()
          original_size = len(data)

          start_marker = b"document.addEventListener('DOMContentLoaded', async function() {"
          end_marker = b'// Fecho de modais ao clicar fora foi desativado a pedido'
          init_old = b'window.TotalGestApp.init({ pwa: true, dialogs: true, bootstrap: false });'
          init_new = b'window.TotalGestApp.init({ pwa: true, dialogs: true, bootstrap: true });'

          if data.count(start_marker) != 1:
              raise SystemExit(f'marcador inicial inesperado: {data.count(start_marker)} ocorrencias')
          if data.count(end_marker) != 1:
              raise SystemExit(f'marcador final inesperado: {data.count(end_marker)} ocorrencias')
          if data.count(init_old) != 1:
              raise SystemExit(f'chamada do shell inesperada: {data.count(init_old)} ocorrencias')
          if data.count(init_new) != 0:
              raise SystemExit('bootstrap ja parece estar ativo')

          start = data.index(start_marker)
          end = data.index(end_marker, start)
          if end <= start:
              raise SystemExit('ordem dos marcadores invalida')

          newline = b'\r\n' if b'\r\n' in data else b'\n'

          # Inclui toda a indentação da linha inicial.
          line_start = data.rfind(newline, 0, start)
          if line_start >= 0:
              line_start += len(newline)
              if data[line_start:start].strip() == b'':
                  start = line_start

          # Mantém o comentário seguinte e remove apenas o listener.
          end_line_start = data.rfind(newline, 0, end)
          if end_line_start >= start:
              end = end_line_start + len(newline)

          bloco = data[start:end]
          if not (400 < len(bloco) < 2_500):
              raise SystemExit(f'tamanho inesperado do bootstrap inline: {len(bloco)} bytes')

          obrigatorios = [
              b'_aplicarTemaGuardado();',
              b'_aplicarSidebarEncolhidaGuardada();',
              b'_aplicarZoomGuardado();',
              b'await bootstrapSupabase();',
              b'inicializar();',
              b'if (_verificarLinkRenovacao())',
              b'await restaurarSessaoAuth();',
              b'_tratarRegressoOAuthTOConline();',
              b'relogioInterval = setInterval(atualizarRelogio, 1000);',
              b'});'
          ]
          for needle in obrigatorios:
              if needle not in bloco:
                  raise SystemExit(f'conteudo esperado em falta: {needle!r}')

          # Não aceita remover acidentalmente definições da aplicação.
          proibidos = [
              b'function inicializar()',
              b'function bootstrapSupabase()',
              b'function restaurarSessaoAuth()',
              b'window.addEventListener(\'beforeunload\''
          ]
          for needle in proibidos:
              if needle in bloco:
                  raise SystemExit(f'conteudo proibido dentro do corte: {needle!r}')

          novo = data[:start] + data[end:]
          novo = novo.replace(init_old, init_new, 1)

          if len(novo) >= original_size:
              raise SystemExit('o app.html nao ficou menor como esperado')
          if novo.count(start_marker) != 0:
              raise SystemExit('o listener inline ainda existe')
          if novo.count(init_new) != 1:
              raise SystemExit('bootstrap nao ficou ativo exatamente uma vez')
          if novo.count(end_marker) != 1:
              raise SystemExit('o comentario posterior foi alterado')

          path.write_bytes(novo)
          print('app.html:', original_size, '->', len(novo), 'bytes; removidos', len(bloco), 'bytes')
          PY

          git diff --check
          git diff --stat
          git diff -- app.html | sed -n '1,180p'

      - name: Commit da migração
        shell: bash
        run: |
          if git diff --quiet -- app.html; then
            echo 'Sem alterações para gravar.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Substituir bootstrap inline pelo módulo externo'
          git push origin HEAD:refactor/separar-index-app
