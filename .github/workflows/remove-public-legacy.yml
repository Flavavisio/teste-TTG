name: Remove public legacy from app

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 1

      - name: Remover código comercial público órfão
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')
          original_size = len(text.encode('utf-8'))

          # 1) A chamada interna já não tem efeito desde que a landing foi removida.
          call_pattern = re.compile(r'(?m)^[ \t]*atualizarLanding\(\);[ \t]*$')
          calls = list(call_pattern.finditer(text))
          if len(calls) != 1:
              raise SystemExit(f'chamada interna atualizarLanding inesperada: {len(calls)}')
          text = text[:calls[0].start()] + text[calls[0].end():]

          # 2) Remove apenas os dois overlays comerciais públicos, terminando antes do banner PWA.
          overlays_start = '    <div id="tg-addon-overlay"'
          banner_start = '    <div id="bannerInstalarPWA"'
          if text.count(overlays_start) != 1 or text.count(banner_start) != 1:
              raise SystemExit('fronteiras dos overlays públicos inesperadas')
          a = text.index(overlays_start)
          b = text.index(banner_start, a)
          overlays = text[a:b]
          for must in ('id="tg-addon-overlay"', 'id="tg-signup-overlay"', 'onsubmit="return submeterSignup(event)"'):
              if must not in overlays:
                  raise SystemExit('marcador de overlay em falta: ' + must)
          if 'id="modalMudarSenhaOverlay"' in overlays or 'id="modalOnboardingOverlay"' in overlays:
              raise SystemExit('ABORT: bloco de overlays invadiu modal privado')
          text = text[:a] + '    <!-- Overlays comerciais públicos removidos; registo em registar.html -->\n\n' + text[b:]

          # 3) Substitui o script público final inteiro por apenas o branding ainda necessário.
          public_script_start = '<script>\nfunction tgCalcularPoupanca(){'
          shell_start = '  <script src="./assets/js/app-shell.js"></script>'
          if text.count(public_script_start) != 1 or text.count(shell_start) != 1:
              raise SystemExit('fronteiras do script público inesperadas')
          a = text.index(public_script_start)
          b = text.index(shell_start, a)
          old_script = text[a:b]
          required = [
              'function loginLanding',
              'function abrirDetalheAddon',
              'function abrirWizardCalc',
              'async function submeterSignup',
              'async function _tgRegistarVisita',
              "supa.functions.invoke('criar_pedido_trial'",
              "supa.functions.invoke('registar-visita'",
              "const logoSrc = 'logo-totalgest.png';"
          ]
          for must in required:
              if must not in old_script:
                  raise SystemExit('marcador do script público em falta: ' + must)
          if 'window.TotalGestApp.init' in old_script:
              raise SystemExit('ABORT: script público alcançou o app shell')

          branding = '''<script>
// Branding da aplicação privada — independente da landing pública.
(function () {
    const logoSrc = 'logo-totalgest.png';
    document.querySelectorAll('.tg-logo-clone').forEach(img => { img.src = logoSrc; });
})();
</script>
'''
          text = text[:a] + branding + text[b:]

          final_size = len(text.encode('utf-8'))

          # Guardas: todo o pacote público tem de desaparecer; componentes privados têm de ficar.
          forbidden = [
              'id="tg-addon-overlay"',
              'id="tg-signup-overlay"',
              'function loginLanding',
              'function abrirDetalheAddon',
              'function abrirWizardCalc',
              'async function submeterSignup',
              'async function _tgRegistarVisita',
              "supa.functions.invoke('criar_pedido_trial'",
              "supa.functions.invoke('registar-visita'",
              'function atualizarLanding',
              'tgCalcularPoupanca'
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit('marcador público ainda presente: ' + marker)

          required_after = [
              'id="bannerInstalarPWA"',
              'id="modalMudarSenhaOverlay"',
              'id="modalOnboardingOverlay"',
              "const logoSrc = 'logo-totalgest.png';",
              'window.TotalGestApp.init({ pwa: true, dialogs: true, bootstrap: true })'
          ]
          for marker in required_after:
              if marker not in text:
                  raise SystemExit('marcador privado essencial em falta: ' + marker)

          if original_size - final_size < 12000:
              raise SystemExit(f'redução abaixo do esperado: {original_size-final_size} bytes')

          path.write_text(text, encoding='utf-8')
          print('app.html:', original_size, '->', final_size, 'bytes; removidos', original_size-final_size, 'bytes')
          PY

          git diff --check
          git diff --stat
          git diff -- app.html | sed -n '1,280p'

      - name: Commit da limpeza
        shell: bash
        run: |
          if git diff --quiet -- app.html; then
            echo 'Sem alterações para gravar.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Remover código público legado da aplicação'
          git push origin HEAD:refactor/separar-index-app
