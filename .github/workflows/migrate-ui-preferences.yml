name: Migrate UI preferences

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 1

      - name: Extrair preferências inline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')
          original = text

          start_marker = '        function alternarTema() {'
          end_marker = '        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('fronteiras UI/Supabase inesperadas')

          a = text.index(start_marker)
          b = text.index(end_marker, a)
          block = text[a:b]
          for must in (
              'function alternarSidebarEncolhida()',
              'function _aplicarSidebarEncolhidaGuardada()',
              'const _NIVEIS_ZOOM = [100, 90, 80];',
              'function alternarZoom()',
              'function _aplicarZoom(nivel)',
              'function _aplicarZoomGuardado()',
              'function _aplicarTemaGuardado()'
          ):
              if must not in block:
                  raise SystemExit('marcador UI em falta: ' + must)
          if len(block.encode('utf-8')) < 1800:
              raise SystemExit('bloco UI inesperadamente pequeno')

          text = text[:a] + '        // Preferências de interface modularizadas em assets/js/app-ui.js\n' + text[b:]

          old_init = 'window.TotalGestApp.init({ pwa: true, toast: true, dialogs: true, bootstrap: true })'
          new_init = 'window.TotalGestApp.init({ pwa: true, toast: true, ui: true, dialogs: true, bootstrap: true })'
          if text.count(old_init) != 1:
              raise SystemExit(f'inicialização do shell inesperada: {text.count(old_init)} ocorrencias')
          text = text.replace(old_init, new_init, 1)

          for forbidden in (
              'function alternarTema() {',
              'function alternarSidebarEncolhida() {',
              'function _aplicarSidebarEncolhidaGuardada() {',
              'const _NIVEIS_ZOOM = [100, 90, 80];',
              'function alternarZoom() {',
              'function _aplicarZoom(nivel) {',
              'function _aplicarZoomGuardado() {',
              'function _aplicarTemaGuardado() {'
          ):
              if forbidden in text:
                  raise SystemExit('UI inline ainda presente: ' + forbidden)

          for required in (
              'const SUPABASE_URL',
              'const SUPABASE_ANON_KEY',
              'const RLS_ATIVO = true;',
              end_marker,
              'onclick="alternarSidebarEncolhida()"',
              'onclick="alternarTema()"',
              'onclick="alternarZoom()"',
              new_init
          ):
              if required not in text:
                  raise SystemExit('marcador essencial em falta: ' + required)

          reduction = len(original.encode('utf-8')) - len(text.encode('utf-8'))
          if reduction < 1800:
              raise SystemExit(f'redução abaixo do esperado: {reduction}')

          path.write_text(text, encoding='utf-8')
          print('Preferências inline removidas e app-ui ativado. Redução:', reduction, 'bytes')
          PY

          git diff --check
          git diff --stat
          git diff -- app.html | sed -n '1,200p'

      - name: Commit da migração
        shell: bash
        run: |
          if git diff --quiet -- app.html; then
            echo 'Sem alterações para gravar.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Extrair preferências de interface da aplicação'
          git push origin HEAD:refactor/separar-index-app
