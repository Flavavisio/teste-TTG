name: Inspect attendance round 10

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar blocos puros de renderizarPonto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ', s+len(marker)); block=text[s:e]
          print('CHARS', len(block), 'LINES', block.count('\n')+1)
          needles=['toLocaleDateString(\'pt-PT\'','innerHTML =','map(','calcularHoras(','_pontoNavModo','_pontoNavData','status','badge','escapeHtmlSimples','new Date(']
          for n in needles: print('COUNT', repr(n), block.count(n))
          for token in ['const _longosComoRegistro','const _wsP =','const _msP =','const _periodoInicio','const _periodoFim','const _fmtData','const _nome','const rows','tbody.innerHTML','empty.style.display']:
              pos=block.find(token)
              if pos>=0:
                  print('\nTOKEN', token)
                  print(block[max(0,pos-700):min(len(block),pos+2600)])
          PY
