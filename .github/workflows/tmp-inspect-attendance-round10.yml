name: Inspect attendance round 10

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar metade final de renderizarPonto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for token in ['if (!_pontoNavData)', 'const _navIni', 'const _regVisiveis', 'const _porPessoa', 'pontoAcordeao', 'innerHTML = _', 'join(\'\')', 'toLocaleDateString']:
              pos=block.find(token)
              if pos>=0:
                  print('\nTOKEN',token)
                  print(block[max(0,pos-500):min(len(block),pos+5000)])
          PY
