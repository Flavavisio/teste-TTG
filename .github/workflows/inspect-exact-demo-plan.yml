name: Inspect profile admin branch

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear ramo admin/subadmin do perfil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          fn = text.index('        function abrirEditarPerfil() {')
          start = text.index("            } else if (usuarioLogado.role === 'admin' || usuarioLogado.role === 'subadmin') {", fn)
          candidates = [
              "            } else if (usuarioLogado.role === 'funcionario') {",
              "            } else if (usuarioLogado.role === 'encarregado') {",
              "            } else {"
          ]
          ends = []
          for marker in candidates:
              try:
                  ends.append((text.index(marker, start + 1), marker))
              except ValueError:
                  pass
          assert ends, 'sem fronteira seguinte'
          end, marker = min(ends)
          block = text[start:end]
          print('next_marker', marker)
          print('linhas_admin', block.count('\n') + 1)
          print(block)
          print('\n=== contagens ===')
          for token in ['campos.innerHTML', 'dados.', 'usuarioLogado', 'adminAtual(', 'document.', 'obterConfig(', 'onclick=', 'onchange=', 'perf_']:
              print(token, block.count(token))
          PY
