name: Inspect collaborators function name

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Locate collaborators rendering functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          for i,line in enumerate(text.splitlines(),1):
              low=line.lower()
              if ('function ' in line or 'renderizar' in low) and ('colabor' in low or 'funcion' in low or 'encarreg' in low or 'equipa' in low):
                  print(f'{i}: {line}')
          for needle in ['tabelaFuncionarios','tabelaColaboradores','colaboradoresToolbar','funcionariosToolbar','emptyFunc','emptyColab']:
              print('---',needle,'---')
              for i,line in enumerate(text.splitlines(),1):
                  if needle in line:
                      print(f'{i}: {line}')
          PY
