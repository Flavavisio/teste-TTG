name: Apply attendance safe batch 23

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrate and validate round 23
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-23.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'); const c={window:{}}; vm.createContext(c); vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'),c); const v=c.window.TotalGestAttendanceView;
          const render=v.createAttendancePersonRenderer({viewState:{nowTime:'17:00',lateLimit:'09:15',expectedTime:'09:00',toleranceMinutes:15},selectedDateIsToday:true,mode:'dia',calculateHours:()=>8,formatHours:h=>String(h),getWorkDescription:()=>'',getClientName:()=>'',escapeHtml:x=>String(x)});
          const html=render('f1',[{data:'2026-09-02',entrada:'08:00',saida:'16:00'}],{absence:null,personName:'Pessoa'}); assert.strictEqual(typeof html,'string'); console.log('SAFE_BATCH_23_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app.html').read_text(); s=t.index('        function renderizarPonto() {'); e=t.index('\n        function ',s+10); p=t[s:e]
          assert p.count('createAttendancePersonRenderer({')==1
          assert p.count('renderAttendancePerson(fid, porPessoa[fid], {')==1
          assert p.count('const _ausenciaHoje = _funcionarioAusenteEm(fid, _hojeSoP);')==1
          assert 'guardarDados(dados)' not in p
          assert "const CACHE = 'totalgest-v166';" in Path('sw.js').read_text()
          print('SAFE_BATCH_23_VERIFY=OK')
          PY
      - name: Commit functional round 23
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair renderer seguro por pessoa do registo de ponto"
          git push origin HEAD:refactor/separar-index-app
