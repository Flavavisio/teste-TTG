name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos principais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('        function renderizarReports() {')
          end = text.index('\n        function ', start + 1)
          reports = text[start:end]
          checks = [
              'window.TotalGestDashboardAnalyticsMetrics.calculate({',
              'window.TotalGestDashboardCounts.calculateContractSummary({',
              'window.TotalGestDashboardCounts.calculateCrmCounts({',
              'window.TotalGestLicenseAddons.renderAddon({',
              'window.TotalGestReportsView.moduleLicenseCard({',
              'window.TotalGestReportsView.revenueBars({',
              'window.TotalGestReportsView.superadminCompanySummary({',
              'window.TotalGestReportsView.distributorClientSummary({',
              'window.TotalGestReportsView.adminOverviewCards({',
              'function renderizarDashboardAnalitico()',
              'function renderizarAuditoria()',
              'function renderizarMinhaLicenca()',
              'function renderizarReports()'
          ]
          for item in checks: print(item, text.count(item))
          assert 'if (!usuarioLogado                container.innerHTML = html;' not in reports
          print('reports_access_guard', reports.count("if (!usuarioLogado || usuarioLogado.role !== 'admin' && usuarioLogado.role !== 'subadmin') {"))
          PY
