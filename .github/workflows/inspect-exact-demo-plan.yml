name: Apply tools domain batch 36

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Separate tools domain and validate
        run: |
          python3 scripts/tmp-migrate-tools-domain-batch-36.py
          node --check assets/js/app-tools-view.js
          node --check assets/js/app-shell.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const c={window:{}}; vm.createContext(c); vm.runInContext(fs.readFileSync('assets/js/app-tools-view.js','utf8'),c); const v=c.window.TotalGestToolsView;
          const eq=(a,b)=>assert.strictEqual(JSON.stringify(a),JSON.stringify(b));
          const tools=[
            {id:'t1',adminId:'a1',nome:'Berbequim',descricao:'X',codigo:'QR1'},
            {id:'t2',adminId:'a2',nome:'Outro',codigo:'QR2'}
          ];
          eq(v.selectToolsForTenant(tools,'a1').map(x=>x.id),['t1']);
          const hist=[
            {id:'h1',adminId:'a1',ferramentaId:'t1',funcionarioId:'f1',dataLevantamento:100,estado:'levantado'},
            {id:'h2',adminId:'a1',ferramentaId:'t1',funcionarioId:'f1',dataLevantamento:200,estado:'devolvido',teveProblema:true},
            {id:'h3',adminId:'a2',ferramentaId:'t2',funcionarioId:'f2',dataLevantamento:300}
          ];
          eq(v.selectToolHistoryForTenant(hist,'a1').map(x=>x.id),['h2','h1']);
          assert.ok(v.toolAvailabilityBadge({}).includes('Levantado'));
          assert.ok(v.toolAvailabilityBadge(null).includes('Disponível'));
          const row=v.toolRowHtml(tools[0],{escapeHtml:String,getCurrentState:()=>({funcionarioId:'f1',dataLevantamento:Date.now()}),getEmployeeName:()=> 'Pessoa'});
          for (const x of ["abrirModalFerramenta('t1')","imprimirQRFerramenta('t1')",'Levantado','Pessoa']) assert.ok(row.includes(x),x);
          assert.ok(v.historyStatusBadge(hist[0]).includes('Em uso'));
          assert.ok(v.historyStatusBadge(hist[1]).includes('Devolvido c/ problema'));
          const hr=v.toolHistoryRowHtml(hist[1],{tools,escapeHtml:String,getEmployeeName:()=> 'Pessoa'});
          assert.ok(hr.includes('Berbequim'));
          console.log('TOOLS_DOMAIN_BATCH_36_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app.html').read_text(encoding='utf-8')
          def block(marker):
              s=t.index(marker); starts=[]
              for pat in ['\n        function ','\n        async function ']:
                  p=t.find(pat,s+len(marker))
                  if p!=-1: starts.append(p)
              return t[s:min(starts)]
          tools=block('        function renderizarFerramentas() {')
          assert tools.count('renderToolsArea({')==1
          for x in ["document.getElementById('tabelaFerramentas')","abrirModalFerramenta('","imprimirQRFerramenta('",'tabelaHistoricoLevantamentos','emptyHistoricoLevantamentos']:
              assert x not in tools,x
          tv=Path('assets/js/app-tools-view.js').read_text(encoding='utf-8')
          for x in ['function toolsViewElements(','function selectToolsForTenant(','function selectToolHistoryForTenant(','function formatToolDate(','function toolAvailabilityBadge(','function toolRowHtml(','function historyStatusBadge(','function toolHistoryRowHtml(','function applyToolsState(','function applyToolHistoryState(','function renderToolsArea(','window.TotalGestToolsView={']:
              assert tv.count(x)==1,(x,tv.count(x))
          shell=Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          assert shell.count("toolsView: './assets/js/app-tools-view.js'")==1
          assert shell.count('if (options.toolsView === true) pedidos.push(MODULOS.toolsView);')==1
          assert t.count('toolsView: true,')==1
          assert 'bootstrapSupabase()' in t
          assert "const CACHE = 'totalgest-v179';" in Path('sw.js').read_text(encoding='utf-8')
          print('TOOLS_DOMAIN_BATCH_36_VERIFY=OK')
          PY
      - name: Commit functional tools separation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-tools-view.js assets/js/app-shell.js sw.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "Separar apresentação do domínio ferramentas"
          git push origin HEAD:refactor/separar-index-app
