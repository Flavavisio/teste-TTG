name: Inspect remaining save branches

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar funcionário cliente e serviço
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          starts = [
              ("funcionario", "            if (ent === 'funcionario') {", "            } else if (ent === 'cliente') {"),
              ("cliente", "            } else if (ent === 'cliente') {", "            } else if (ent === 'servico') {"),
              ("servico", "            } else if (ent === 'servico') {", "            } else if (ent === 'folha') {")
          ]
          for name, a, b in starts:
              s = text.index(a)
              e = text.index(b, s)
              block = text[s:e]
              print(f'\n===== {name} ({block.count(chr(10))+1} linhas) =====')
              print(block)
              print('--- contagens ---')
              for token in ['await ', 'guardarDados(', '_guardarArmazem(', 'dados.', 'document.', 'alert(', 'confirm(', 'prompt(', 'supa.', 'fetch(', 'setTimeout(', 'return;']:
                  print(token, block.count(token))
          fn = text.index('        async function _salvarFormularioInterno() {')
          tail = text.index("            } else if (ent === 'fornecedor') {", fn)
          print('\n===== início do common tail depois dos ramos fall-through =====')
          print(text[tail:tail+8000])
          PY
