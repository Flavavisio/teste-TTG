name: Inspect profile modal orchestration

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar abrirEditarPerfil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('function abrirEditarPerfil() {')
          end = text.index('\n        function fecharModalPerfil()', start)
          block = text[start:end]
          print('LINES', len(block.splitlines()))
          print(block)
          print('\nTOKENS')
          for token in [
              'document.getElementById(',
              'usuarioLogado',
              'dados.',
              'window.TotalGestProfileModalSuperadmin.render({',
              'window.TotalGestProfileModalDistributor.render({',
              'window.TotalGestProfileModalAdmin.render({',
              'window.TotalGestProfileModalWorker.render({',
              "overlay.classList.add('open')",
              'campos.innerHTML =',
              'return;'
          ]:
              print(token, block.count(token))
          PY
