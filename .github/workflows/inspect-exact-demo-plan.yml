name: Inspect brand deployment boundary

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect brand stylesheet loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','app.html','login.html','registar.html','redefinir-password.html','confirmar-trial.html']:
              p=Path(name)
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              print('---',name,'---')
              for line in text.splitlines():
                  if 'stylesheet' in line or 'theme-color' in line or 'brand-theme' in line:
                      print(line)
              print('BRAND_LINK_COUNT=',text.count('assets/css/brand-theme.css'))
          PY
