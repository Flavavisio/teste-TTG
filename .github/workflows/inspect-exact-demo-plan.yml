name: Inspect sync toast exact block

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mostrar bloco exato do toast de sincronização
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          for n in range(3195, 3265):
              if n < len(lines):
                  print(n + 1, repr(lines[n]))
          PY
