name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos de serviços
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarServicos() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for item in ['servicesViewElements(document)','prepareServicesForRendering({','createServiceRenderDependencies({','createServicesAreaRenderer({','selectPending: renderDependencies.selectPendingSpecialty','prepareRow: renderDependencies.prepareRow','renderServicesArea(selectionState)','buildActions: (s, rowData) => ({']:
              assert block.count(item)==1,(item,block.count(item))
          for item in ['const servicos = selectionState.services;','createPendingSpecialtySelector({','renderPendingSpecialtyNotice({','createServicesTableStateRenderer({','renderTableState(','createServiceRowPreparerFromData({','createServiceRowsRenderer({','renderPreparedRows(','selectVisibleServicesFromData({','createServiceFilterSorter({','filterServices(servicos)','const totalGeralOS =','const tbody =','const empty =','createServiceRowPreparer({','createServiceRowRenderer({','createPreparedServiceRowsRenderer({','applySpecialtyAndHistoryNotice({','renderServicesTableState({','renderServiceRowsToTable({','const rowData = prepareRow(s);','return renderRow(s, rowData, {',"document.getElementById('tabelaServicos')","document.getElementById('emptyServ')","document.getElementById('servicosAvisoEspecialidade')","document.getElementById('servicosToolbar')",'selectPendingSpecialtyServicesForUser({','tbody.innerHTML = servicos.map(','selectVisibleServices({','selectPendingSpecialtyServices({','specialtyAndHistoryNotice({','specialtyAndHistoryNoticeFromState({','serviceHistoryLoadedSinceLabel(_servicosCarregadoDesde)','servicesTableState({','applyServicesTableState({','filterAndSortServices({','serviceRowFromData({','badgeClass: statusBadge(s.status)','descriptionHtml: escapeHtmlSimples','workTypesHtml: _tiposTrabalhoBadgesHTML','const tableState =','const tbOS =','prepareServiceRow({',"_aplicarFiltroOrdenacao('servicos'","_getTableState('servicos')",'servicos.sort(','_toolbarHtml(','servicos.length === 0','Sem resultados para essa pesquisa.',"new Date(_servicosCarregadoDesde + 'T00:00:00')",'statusControl({','serviceStatusControl({','const statusHtml =','const podeEditar =','workSheetActions({','rowLeadingCells({','rowActions({','serviceRow({','leadingCells: {','tbOS.innerHTML = tableState.toolbarHtml','tbody.innerHTML = tableState.emptyRowsHtml','empty.style.display = tableState.emptyDisplay','const folhaOS =','const btnCriarFolha =']:
              assert block.count(item)==0,(item,block.count(item))
          for item in ['invoiceTOId:','invoiceMoloniId:','invoiceMoloniUrl:','receiptMoloniUrl:','guideMoloniId:','guideMoloniUrl:','creditNoteMoloniId:','creditNoteMoloniUrl:']:
              assert block.count(item)==1,(item,block.count(item))
          assert "const CACHE = 'totalgest-v149';" in Path('sw.js').read_text(encoding='utf-8')
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
