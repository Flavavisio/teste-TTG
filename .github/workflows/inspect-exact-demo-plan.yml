name: Inspect requisicao modal block

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar requisição
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          m=text.index('        function abrirModal(')
          a="            } else if (entidade === 'requisicao') {\n"; b="            } else if (entidade === 'fornecedor') {\n"
          s=text.index(a,m); e=text.index(b,s); block=text[s:e]
          print(block)
          PY
