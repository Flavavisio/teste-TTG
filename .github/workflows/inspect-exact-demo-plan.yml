name: Inspect app module bootstrap

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect module bootstrap markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          for needle in ['TotalGestApp.init', 'alertsView', 'servicesSelection', 'attendanceView']:
              print('---',needle,'---')
              pos=0
              while True:
                  i=text.find(needle,pos)
                  if i<0: break
                  ls=text.rfind('\n',0,i)+1
                  le=text.find('\n',i)
                  print(text[ls:le])
                  pos=i+len(needle)
          PY
