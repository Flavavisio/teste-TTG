name: Inspect inventory domain boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect articles and suppliers exact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          def block(name):
              marker='        function '+name+'() {'
              s=text.index(marker)
              starts=[]
              for pat in ['\n        function ','\n        async function ']:
                  p=text.find(pat,s+len(marker))
                  if p!=-1: starts.append(p)
              e=min(starts)
              return text[s:e]
          for name in ['renderizarArtigos','renderizarFornecedores']:
              b=block(name)
              print(name+'_CHARS=',len(b)); print(name+'_LINES=',b.count('\n')+1)
              print('---'+name+'_START---'); print(b); print('---'+name+'_END---')
          PY
