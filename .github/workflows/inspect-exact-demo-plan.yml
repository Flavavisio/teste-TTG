name: Apply fourteenth safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar décimo quarto lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-14.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const context={window:{}}; vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'),context);
          const v=context.window.TotalGestAttendanceView;
          const r={id:'r1',data:'2026-09-02',entrada:'08:00',saida:'17:00',servicoId:'os1',clienteId:'c1',foto:'foto.jpg',lat:38.7,lng:-9.1,latSaida:38.8,lngSaida:-9.2,editadoPor:'Admin',editadoEm:'2026-09-02T10:00:00Z',motivoEdicao:'Teste'};
          const row=v.prepareAttendanceRecordRow(r,{
            mode:'semana',
            calculateHours:()=>9,
            formatHours:h=>`${h}h`,
            getWorkDescription:()=> 'OS Teste',
            getClientName:()=> 'Cliente Teste',
            escapeHtml:x=>x
          });
          assert.strictEqual(row.hoursHtml,'9h');
          assert.strictEqual(row.clientName,'Cliente Teste');
          assert.strictEqual(row.workHtml,'OS Teste');
          assert(row.entryHtml.includes('fa-pen'));
          assert(row.photoHtml.includes('foto.jpg'));
          assert(row.gpsEntryHtml.includes('google.com/maps'));
          assert(row.dateHtml.includes('02/09'));
          const noExit=v.attendanceRecordHours({entrada:'08:00'},()=>9,h=>`${h}h`);
          assert.strictEqual(noExit,'');
          console.log('SAFE_BATCH_14_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          assert block.count('prepareAttendanceRecordRow(r, {')==1
          assert block.count('attendanceRecordRow(')==1
          for old in ['const horas = r.saida ? calcularHoras(r.entrada, r.saida) : null;','const obra = escapeHtmlSimples(','const clienteNome = r.clienteId ?','attendanceEditTitle(r, escapeHtmlSimples)','attendancePhotoHtml(r.foto)','attendanceGpsHtml(r.lat, r.lng)','attendanceDateCell(r.data, _pontoNavModo)']:
              assert old not in block, old
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function attendanceRecordHours(','function attendanceRecordWorkplace(','function attendanceRecordMedia(','function prepareAttendanceRecordRow(']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          assert "const CACHE = 'totalgest-v157';" in Path('sw.js').read_text(encoding='utf-8')
          print('SAFE_BATCH_14_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair preparação segura das linhas do registo de ponto"
          git push origin HEAD:refactor/separar-index-app
