name: Migrate services notice view

on:
  push:
    branches:
      - refactor/separar-index-app
    paths:
      - '.github/workflows/inspect-exact-demo-plan.yml'
      - '.github/scripts/migrate-services-notice-view.py'
      - 'assets/js/app-services-view.js'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Migrar avisos de serviços
        run: python3 .github/scripts/migrate-services-notice-view.py
      - name: Validar migração
        run: |
          node --check assets/js/app-services-view.js
          node --check assets/js/app-shell.js
          node --check sw.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.html assets/js/app-shell.js sw.js "
          node <<'NODE'
          global.window = {};
          require('./assets/js/app-services-view.js');
          const view = window.TotalGestServicesView;
          const pending = [1,2,3,4,5].map(i => ({ number:`OS-${i}`, types:['AVAC'] }));
          const html = view.specialtyAndHistoryNotice({ canSeePending:true, pendingServices:pending, loadedSinceLabel:'01/06/2026' });
          if (!html.includes('<strong>5</strong>') || !html.includes('OS-1 (AVAC)') || !html.includes(' ...')) throw new Error('pending-preview');
          if (!html.includes('Carregar OS mais antigas (+3 meses)') || !html.includes('01/06/2026')) throw new Error('history-control');
          if (html.includes('OS-5 (AVAC)')) throw new Error('preview-limit');
          const hidden = view.specialtyAndHistoryNotice({ canSeePending:false, pendingServices:pending, loadedSinceLabel:'—' });
          if (hidden.includes('triangle-exclamation') || !hidden.includes('Carregar OS mais antigas')) throw new Error('hidden-pending');
          console.log('SERVICES_NOTICE_VIEW_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.html').read_text(encoding='utf-8')
          shell = Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          start = app.index('        function renderizarServicos() {')
          end = app.index('\n        function ', start + 1)
          block = app[start:end]
          assert block.count('window.TotalGestServicesSelection.selectVisibleServices({') == 1
          assert block.count('window.TotalGestServicesView.specialtyAndHistoryNotice({') == 1
          assert block.count('tbody.innerHTML = servicos.map(') == 1
          assert 'btn-carregar-os-antigas' not in block
          for item in ['faturarOSViaTOConline(', 'faturarOSViaMoloni(', '_verificarPagamentoMoloni(', 'emitirGuiaTransporteMoloni(', 'emitirNotaCreditoMoloni(']:
              assert block.count(item) == 1, (item, block.count(item))
          assert shell.count("servicesView: './assets/js/app-services-view.js'") == 1
          assert shell.count('if (options.servicesView === true) pedidos.push(MODULOS.servicesView);') == 1
          assert app.count('servicesView: true') == 1
          assert sw.count("'./assets/js/app-services-view.js',") == 1
          assert "const CACHE = 'totalgest-v128';" in sw
          print('SERVICES_NOTICE_VIEW_VALIDATION=OK')
          PY
      - name: Commit da migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html assets/js/app-shell.js sw.js
          git commit -m "Extrair avisos visuais das ordens de serviço"
          git push origin refactor/separar-index-app
