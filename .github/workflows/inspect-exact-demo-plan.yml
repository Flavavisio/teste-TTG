name: Inspect final sync orchestration

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mostrar corpo atual de _sincronizar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(lines) if 'async function _sincronizar()' in l)
          end = next(i for i in range(start + 1, len(lines)) if '// -------- bootstrap --------' in lines[i])
          for i in range(start, end):
              print(f'{i+1}: {lines[i]}')
          PY
