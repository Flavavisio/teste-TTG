name: Inspect snapshot usages

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mostrar contextos adicionais dos snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          for start,end,title in [
              (3155,3185,'contador/estado pendente'),
              (11945,11980,'escrita adicional em snapshot')
          ]:
              print(f'\n=== {title} ===')
              for i in range(start-1, min(len(lines), end)):
                  print(f'{i+1}: {lines[i]}')
          PY
