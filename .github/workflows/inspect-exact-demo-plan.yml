name: Inspect remaining servico validations

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar validações restantes do serviço
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('                obj = window.TotalGestSaveFormServicoObject.prepare({')
          end = text.index("            } else if (ent === 'folha') {", start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in [
              '_bloquearSeAusenteEmOS(',
              'Selecione um cliente.',
              'outrasNoMesmoDia',
              'tiposRepetidos',
              '_horaMin(',
              'emConflito',
              'obterNomeFuncionario(',
              'gerarNumeroRegistoServidor()',
              'confirm(',
              'dados.servicos',
              'await '
          ]:
              print(token, block.count(token))
          PY
          echo 'auditoria-servico-validacoes'
