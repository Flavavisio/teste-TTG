name: Apply alerts safe batch 26

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrate and validate alerts
        run: |
          python3 scripts/tmp-migrate-alerts-safe-batch-26.py
          node --check assets/js/app-alerts-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const c={window:{}}; vm.createContext(c); vm.runInContext(fs.readFileSync('assets/js/app-alerts-view.js','utf8'),c); const v=c.window.TotalGestAlertsView;
          const os=v.pendingServiceOrdersAlert([{adminId:'a1',status:'pendente'}],'a1'); assert.ok(os && os.titulo.includes('ordem de serviço'));
          const as=v.pendingAssistancesAlert([{adminId:'a1',status:'por aprovar'}],'a1'); assert.ok(as && as.tipo==='warning');
          const rq=v.pendingRequisitionsAlert([{adminId:'a1',status:'pendente_aprov'}],'a1'); assert.ok(rq && rq.acao.includes('requisicoes'));
          const pd=v.pendingLeaveRequestsAlert([{adminId:'a1',status:'pendente'}],'a1'); assert.ok(pd && pd.acao.includes('pedidos'));
          assert.strictEqual(v.pendingServiceOrdersAlert([], 'a1'), null);
          console.log('SAFE_BATCH_26_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app.html').read_text()
          def block(marker):
              s=t.index(marker); e=t.index('\n        function ',s+len(marker)); return t[s:e]
          a=block('        function renderizarAlertas() {')
          for x in ['pendingServiceOrdersAlert(','pendingAssistancesAlert(','pendingRequisitionsAlert(','pendingLeaveRequestsAlert(']: assert a.count(x)==1,(x,a.count(x))
          for x in ["_notificarPorFaseVencimento('contrato_vencer_", "_notificarPorFaseVencimento('frota_vencer_", "_notificarPorFaseVencimento('licenca_", "_notificarPorFaseVencimento('registo_previo_", "_notificarPorFaseVencimento('anepc_", "_notificarPorFaseVencimento('shst_"]: assert a.count(x)==1,(x,a.count(x))
          assert "const CACHE = 'totalgest-v169';" in Path('sw.js').read_text()
          print('SAFE_BATCH_26_VERIFY=OK')
          PY
      - name: Commit functional alerts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-alerts-view.js sw.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair segunda ronda segura dos alertas"
          git push origin HEAD:refactor/separar-index-app
