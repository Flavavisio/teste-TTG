name: Apply eighth safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar oitavo lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-8.py
          node --check assets/js/app-attendance-view.js
          node --check assets/js/app-shell.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js', 'utf8'), context);
          const view = context.window.TotalGestAttendanceView;
          assert.strictEqual(view.formatHours(0), '0h 0m');
          assert.strictEqual(view.formatHours(1.5), '1h 30m');
          const monday = view.startOfWeekMonday(new Date('2026-09-02T12:00:00Z'));
          assert.strictEqual(monday.getDay(), 1);
          assert.strictEqual(monday.getDate(), 31);
          const row = view.teamSummaryRow({ name:'Ana', type:'Funcionário', appBadge:'APP', serviceBadge:'SERV', workplace:'Obra A', hoursToday:7.5, hoursWeek:35, contractedHours:40, balance:-5, balanceText:'−5h 0m' });
          assert(row.includes('Ana'));
          assert(row.includes('7h 30m'));
          assert(row.includes('−5h 0m'));
          const card = view.teamSummaryCard({ inServiceCount:1, peopleCount:2, rowsHtml:row });
          assert(card.includes('1 em serviço · 1 fora'));
          assert(card.includes(row));
          assert(view.teamSummaryCard({ peopleCount:0, inServiceCount:0, rowsHtml:'' }).includes('Sem funcionários ou encarregados.'));
          console.log('SAFE_BATCH_8_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          assert text.count('window.TotalGestAttendanceView.startOfWeekMonday()') == 1
          assert text.count('window.TotalGestAttendanceView.formatHours(h)') == 1
          assert text.count('window.TotalGestAttendanceView.teamSummaryRow({') == 1
          assert text.count('window.TotalGestAttendanceView.teamSummaryCard({') == 1
          shell=Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          assert shell.count("attendanceView: './assets/js/app-attendance-view.js'") == 1
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert sw.count("'./assets/js/app-attendance-view.js'") == 1
          assert "const CACHE = 'totalgest-v151';" in sw
          print('SAFE_BATCH_8_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-shell.js assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "Extrair apresentação segura do resumo de ponto"
          git push origin HEAD:refactor/separar-index-app
