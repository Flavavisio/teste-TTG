name: Inspect folha ponto branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar fecho de picagem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('                // Fecha automaticamente uma picagem aberta da mesma OS')
          end = text.index("            } else if (ent === 'requisicao') {", start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in ['dados.ponto', 'dataSaida', 'horaSaida', 'guardarDados(', '_folhaConsumoPendente', 'renderizar', 'Date.now()', 'getDataHoje()']:
              print(token, block.count(token))
          PY
