name: Inspect folha context boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar contexto da folha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'folha') {\n")
          end = text.index("                const _foAssinaturaBase64 = capturarAssinatura() || null;\n", start)
          block = text[start:end]
          print(block)
          print('\n=== boundary counts ===')
          for token in ['_foHorasCorrigidasManualmente', '_horasPicadasOS(', '_horasPicadasObra(', 'dados.clientes', 'dados.locais', 'gerarId()', 'mostrarErro(', 'alert(']:
              print(token, block.count(token))
          PY
