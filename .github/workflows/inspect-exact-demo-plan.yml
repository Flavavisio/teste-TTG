name: Apply twenty-first safe attendance batch

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrate and validate
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-21.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'); const c={window:{}}; vm.createContext(c); vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'),c); const v=c.window.TotalGestAttendanceView;
          const grouped={f1:[{data:'2026-09-02',entrada:'08:00',saida:'16:00'}]};
          const ms=v.prepareMissingAttendanceState(grouped,{selectedDate:'2026-09-02',today:'2026-09-02',role:'admin',nowTime:'10:00',lateLimit:'09:15',employees:[{id:'f1',adminId:'t1',ativo:true},{id:'f2',adminId:'t1',ativo:true}],managers:[],tenantId:'t1'}); assert.ok(ms.shouldApply); assert.ok(ms.missingIds.includes('f2'));
          v.applyMissingAttendancePeople(grouped,{selectedDate:'2026-09-02',today:'2026-09-02',role:'admin',nowTime:'10:00',lateLimit:'09:15',employees:[{id:'f1',adminId:'t1',ativo:true},{id:'f2',adminId:'t1',ativo:true}],managers:[],tenantId:'t1'}); assert.ok(Array.isArray(grouped.f2));
          assert.strictEqual(v.attendancePersonName('a1',[{id:'a1',nome:'Admin'}],()=> 'Fallback'),'Admin');
          const html=v.prepareAttendancePersonAccordionItem('f1',[{data:'2026-09-02',entrada:'08:00',saida:'16:00'}],{absence:null,personName:'Pessoa',nowTime:'17:00',selectedDateIsToday:true,lateLimit:'09:15',expectedTime:'09:00',toleranceMinutes:15,mode:'dia',calculateHours:()=>8,formatHours:h=>String(h),getWorkDescription:()=>'',getClientName:()=>'',escapeHtml:x=>String(x)}); assert.ok(typeof html==='string');
          console.log('SAFE_BATCH_21_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app.html').read_text(); s=t.index('        function renderizarPonto() {'); e=t.index('\n        function ',s+10); p=t[s:e]
          for x in ['applyMissingAttendancePeople(porPessoa, {','attendancePersonName(','prepareAttendancePersonAccordionItem(fid, porPessoa[fid], {']:
              assert p.count(x)==1,(x,p.count(x))
          assert p.count('const _ausenciaHoje = _funcionarioAusenteEm(fid, _hojeSoP);')==1
          assert 'guardarDados(dados)' not in p
          a=Path('assets/js/app-attendance-view.js').read_text();
          for x in ['function prepareMissingAttendanceState(','function applyMissingAttendancePeople(','function attendancePersonName(','function prepareAttendancePersonAccordionItem(']: assert a.count(x)==1
          assert "const CACHE = 'totalgest-v164';" in Path('sw.js').read_text()
          print('SAFE_BATCH_21_VERIFY=OK')
          PY
      - name: Commit functional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair composição final segura do registo de ponto"
          git push origin HEAD:refactor/separar-index-app
