name: Inspect remaining folha save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar restante da folha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'folha') {\n")
          end = text.index("            } else if (ent === 'requisicao') {\n", start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in ['guardarDados(', 'renderizarTudo(', 'fecharModal(', 'dados.folhasObra', '_folhaConsumoPendente', '_foAssistenciaParaAtualizar', 'dados.ponto', 'registosManutencao', 'setTimeout(', 'await ']:
              print(token, block.count(token))
          PY
