name: Apply eleventh safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar décimo primeiro lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-11.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'), context);
          const view = context.window.TotalGestAttendanceView;
          assert(view.attendancePhotoHtml('x.jpg').includes('foto-miniatura'));
          assert.strictEqual(view.attendancePhotoHtml(''), '');
          assert(view.attendanceGpsHtml(38.7,-9.1).includes('google.com/maps'));
          assert(view.attendanceGpsHtml(null,null).includes('—'));
          assert.strictEqual(view.attendanceDateCell('2026-09-02','dia'), '');
          assert(view.attendanceDateCell('2026-09-02','semana').includes('02/09'));
          const row = view.attendanceRecordRow({dateHtml:'D',entryHtml:'08:00',exitHtml:'17:00',hoursHtml:'8h',clientName:'Cliente',workHtml:'Obra',recordId:'r1'});
          assert(row.includes('Cliente — Obra'));
          assert(row.includes("_abrirEdicaoPontoRegisto('r1')"));
          const item = view.attendanceAccordionItem({personId:'f1',nameHtml:'Ana',summaryHtml:'08:00 → 17:00',rowsHtml:'ROW',hasRecords:true,mode:'semana'});
          assert(item.includes('ponto-acc-f1'));
          assert(item.includes('>Dia</span>'));
          assert(item.includes('ROW'));
          console.log('SAFE_BATCH_11_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for item in ['attendancePhotoHtml(r.foto)','attendanceGpsHtml(r.lat, r.lng)','attendanceGpsHtml(r.latSaida, r.lngSaida)','attendanceDateCell(r.data, _pontoNavModo)','attendanceRecordRow({','attendanceAccordionItem({']:
              assert block.count(item)==1,(item,block.count(item))
          for item in ['const cabecalho = `<div class="ponto-acc-sub-row"','return `<div class="ponto-acc-sub-row">','const fotoHtml = r.foto ?','const gpsEntradaHtml = (r.lat && r.lng) ?']:
              assert block.count(item)==0,(item,block.count(item))
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function attendancePhotoHtml(','function attendanceGpsHtml(','function attendanceDateCell(','function attendanceRecordRow(','function attendanceAccordionItem(']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          assert "const CACHE = 'totalgest-v154';" in Path('sw.js').read_text(encoding='utf-8')
          print('SAFE_BATCH_11_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair apresentação segura do acordeão de ponto"
          git push origin HEAD:refactor/separar-index-app
