name: Apply eighteenth safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar décimo oitavo lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-18.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const context={window:{}}; vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'),context);
          const v=context.window.TotalGestAttendanceView;
          const nodes={
            empty:{style:{}}, accordion:{innerHTML:'x'}, weeklyBalance:{textContent:'x'}
          };
          const fakeDoc={getElementById:id=>id==='emptyPonto'?nodes.empty:id==='pontoAcordeao'?nodes.accordion:nodes.weeklyBalance};
          const els=v.attendanceViewElements(fakeDoc);
          assert.strictEqual(els.accordion,nodes.accordion);
          assert.strictEqual(v.applyAttendanceEmptyState(els,true),true);
          assert.strictEqual(nodes.accordion.innerHTML,'');
          assert.strictEqual(nodes.empty.style.display,'block');
          assert.strictEqual(nodes.weeklyBalance.textContent,'Horas esta semana: 0h 0m');
          const nav=v.prepareAttendanceNavigation([
            {funcionarioId:'f1',data:'2026-09-02'},
            {funcionarioId:'f2',data:'2026-09-01'}
          ],{selectedDate:null,today:'2026-09-02',mode:'dia'});
          assert.strictEqual(nav.selectedDate,'2026-09-02');
          assert.strictEqual(nav.selectedRecords.length,1);
          assert.strictEqual(nav.groupedRecords.f1.length,1);
          const timing=v.attendanceTimingConfig({horaEntradaHabitual:'08:30',toleranciaAtrasoMin:10});
          assert.strictEqual(timing.expectedTime,'08:30');
          assert.strictEqual(timing.toleranceMinutes,10);
          assert.strictEqual(timing.lateLimit,'08:40');
          assert.strictEqual(v.applyAttendanceAccordionState(els,'<x>',1),true);
          assert.strictEqual(nodes.accordion.innerHTML,'<x>');
          assert.strictEqual(nodes.empty.style.display,'none');
          assert.strictEqual(v.applyAttendanceAccordionState(els,'ignored',0),false);
          assert.strictEqual(nodes.accordion.innerHTML,'');
          assert.strictEqual(nodes.empty.style.display,'block');
          console.log('SAFE_BATCH_18_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for item in ['attendanceViewElements(document)','applyAttendanceEmptyState(attendanceElements, registros.length === 0)','prepareAttendanceNavigation(registros, {','attendanceTimingConfig(adminAtual())','applyAttendanceAccordionState(attendanceElements, htmlAcc, Object.keys(porPessoa).length)']:
              assert block.count(item)==1,(item,block.count(item))
          assert block.count('const _ausenciaHoje = _funcionarioAusenteEm(fid, _hojeSoP);')==1
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function attendanceViewElements(','function applyAttendanceEmptyState(','function prepareAttendanceNavigation(','function attendanceTimingConfig(','function applyAttendanceAccordionState(']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          assert "const CACHE = 'totalgest-v161';" in Path('sw.js').read_text(encoding='utf-8')
          print('SAFE_BATCH_18_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair estado visual seguro do registo de ponto"
          git push origin HEAD:refactor/separar-index-app
