name: Inspect clients domain boundary

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect renderizarClientes exact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarClientes() {'
          s=text.index(marker)
          e=text.index('\n        function ',s+len(marker))
          block=text[s:e]
          print('CLIENTS_CHARS=',len(block))
          print('CLIENTS_LINES=',block.count('\n')+1)
          print('---CLIENTS_START---')
          print(block)
          print('---CLIENTS_END---')
          PY
