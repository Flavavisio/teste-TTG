name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos principais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          checks = [
              'window.TotalGestSaveFormServico.run({',
              'window.TotalGestProfileModal.render({',
              'window.TotalGestProfileSave.run({',
              'window.TotalGestCardVisibility.run({',
              'window.TotalGestHomeDashboard.run({',
              'window.TotalGestMyDay.run({',
              'window.TotalGestReportsSuperadminMetrics.calculate({',
              'window.TotalGestReportsModuleMetrics.calculateContracts({',
              'window.TotalGestReportsModuleMetrics.calculateFleet({',
              'function renderizarOMeuDia(',
              'function renderizarReports(',
              'function _salvarFormularioInterno(',
              'function guardarDados()',
              'async function _sincronizar()',
              'async function carregarDados('
          ]
          for item in checks:
              print(item, text.count(item))
          PY
