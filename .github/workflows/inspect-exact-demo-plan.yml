name: Migrate admin report summary

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Migrar resumo admin
        run: python3 .github/scripts/migrate-admin-report-summary.py
      - name: Validar migração
        run: |
          node --check assets/js/app-reports-distributor-metrics.js
          node --check assets/js/app-reports-view.js
          node --check sw.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.html assets/js/app-reports-distributor-metrics.js assets/js/app-reports-view.js sw.js "
          node <<'NODE'
          global.window = {};
          require('./assets/js/app-reports-distributor-metrics.js');
          require('./assets/js/app-reports-view.js');
          const m = window.TotalGestReportsDistributorMetrics;
          const data = {
            funcionarios: [{adminId:'a',role:'funcionario',ordenadoBruto:'1000'}],
            encarregados: [{adminId:'a',ordenadoBruto:'500'}],
            clientes: [{adminId:'a'}],
            servicos: [{adminId:'a',status:'pendente'},{adminId:'a',status:'concluído'}],
            ponto: [{adminId:'a'}], pedidos: [{adminId:'a',status:'pendente_aprov'}],
            folhasObra: [{adminId:'a',contratoId:'c'}], requisicoes: [{adminId:'a',status:'pendente_aprov'}],
            contratos: [{adminId:'a',valor:'120'}], locais: [{adminId:'a'}], equipamentos: [{adminId:'a'}],
            registosManutencao: [{adminId:'a'}], veiculos: [{adminId:'a'}],
            veiculoIntervencoes: [{adminId:'a',custo:123.45}], veiculoSinistros: [{adminId:'a'}],
            ajudas: [{adminId:'a',status:'pendente'}]
          };
          const out = m.calculateAdminSummary({
            data,
            admin:{id:'a',contratosPlano:'mensal'},
            maintenanceState:()=>({chave:'em_dia'}), nextMaintenance:()=>null,
            contractsActive:()=>true,
            countFleet:()=>({total:1,emDia:1,aVencer:0,vencido:0})
          });
          if (out.totalFunc !== 1 || out.totalEncarregados !== 1 || out.gastoTotal !== 1500) throw new Error('overview');
          if (out.contratosCount !== 1 || out.ctEmDia !== 1 || out.ctValor !== 120) throw new Error('contracts');
          if (out.frotaTotal !== 1 || out.gastoVeiculos !== 123.45 || out.suporteTotal !== 1) throw new Error('operations');
          const html = window.TotalGestReportsView.adminOverviewCards(out);
          for (const needle of ['Recursos Humanos','Contratos de Manutenção','Frota','Suporte Técnico','1.500,00','123,45']) {
            if (!html.includes(needle)) throw new Error('view ' + needle);
          }
          console.log('ADMIN_REPORT_SUMMARY_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          start = app.index('        function renderizarReports() {')
          end = app.index('\n        function ', start + 1)
          block = app[start:end]
          assert block.count('window.TotalGestReportsDistributorMetrics.calculateAdminSummary({') == 1
          assert block.count('window.TotalGestReportsView.adminOverviewCards(_adminSummary)') == 1
          assert block.count('window.TotalGestReportsModuleMetrics.calculateOverview({') == 1
          assert block.count('window.TotalGestReportsSuperadminMetrics.calculateCompanySummary({') == 1
          assert block.count('window.TotalGestReportsDistributorMetrics.calculateClientSummary({') == 1
          assert 'const _adminOverview =' not in block
          assert 'const _adminContracts =' not in block
          assert 'const _adminOperations =' not in block
          assert "const CACHE = 'totalgest-v125';" in sw
          print('ADMIN_REPORT_SUMMARY_VALIDATION=OK')
          PY
      - name: Commit da migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html assets/js/app-reports-distributor-metrics.js assets/js/app-reports-view.js sw.js
          git commit -m "Agregar resumo admin dos relatórios"
          git push origin refactor/separar-index-app
