name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Verificar estado atual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          marker = '        function renderizarServicos() {'
          assert text.count(marker) == 1
          assert "const CACHE = 'totalgest-v136';" in Path('sw.js').read_text(encoding='utf-8')
          print('CURRENT_BOUNDARY=OK')
          PY
