name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos de serviços
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          marker = '        function renderizarServicos() {'
          start = text.index(marker)
          end = text.index('\n        function ', start + len(marker))
          block = text[start:end]
          for item in ['selectVisibleServices({','selectPendingSpecialtyServices({','prepareServiceRow({','filterAndSortServices({','specialtyAndHistoryNotice({','serviceHistoryLoadedSinceLabel(_servicosCarregadoDesde)','servicesTableState({','serviceStatusControl({','serviceRow({']:
              assert block.count(item) == 1, (item, block.count(item))
          for item in ["_aplicarFiltroOrdenacao('servicos'","_getTableState('servicos')",'servicos.sort(','_toolbarHtml(','servicos.length === 0','Sem resultados para essa pesquisa.',"new Date(_servicosCarregadoDesde + 'T00:00:00')",'statusControl({','const podeEditar =','workSheetActions({','rowLeadingCells({','rowActions({','const folhaOS =','const btnCriarFolha =','obterNomeFuncionario(','gerarNumeroRegisto()','_osTemMateriais(','moduloErpAtivo(']:
              assert block.count(item) == 0, (item, block.count(item))
          assert "const CACHE = 'totalgest-v139';" in Path('sw.js').read_text(encoding='utf-8')
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
