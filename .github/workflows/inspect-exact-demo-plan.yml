name: Inspect team module bootstrap

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect current clients module bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          for i,line in enumerate(text.splitlines(),1):
              if 'clientsView' in line or 'alertsView' in line or 'dashboardCounts' in line:
                  print(f'{i}: {line}')
          PY
