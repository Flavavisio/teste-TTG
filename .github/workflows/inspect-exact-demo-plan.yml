name: Diagnose app shell options

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Localizar configuração do shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          for needle in ['reportsView', 'TotalGestAppShell', 'carregarModulos', 'iniciar({']:
              print('---', needle, '---')
              pos = 0
              found = 0
              while True:
                  pos = text.find(needle, pos)
                  if pos < 0: break
                  found += 1
                  left = max(0, text.rfind('\n', 0, max(0, pos - 500)))
                  right = text.find('\n', min(len(text), pos + 700))
                  if right < 0: right = len(text)
                  print(text[left:right])
                  pos += len(needle)
              print('count=', found)
          print('DIAGNOSE_APP_SHELL_OPTIONS=OK')
          PY
