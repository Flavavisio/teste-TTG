name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos de serviços
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          marker = '        function renderizarServicos() {'
          start = text.index(marker)
          end = text.index('\n        function ', start + len(marker))
          block = text[start:end]
          for item in ['selectVisibleServicesFromData({','selectPendingSpecialtyServicesForUser({','applySpecialtyAndHistoryNotice({','createServiceFilterSorter({','filterServices(servicos)','renderServicesTableState({','createServiceRowPreparer({','createServiceRowRenderer({','return renderRow(s, rowData, {']:
              assert block.count(item) == 1, (item, block.count(item))
          for item in ['selectVisibleServices({','selectPendingSpecialtyServices({','specialtyAndHistoryNotice({','specialtyAndHistoryNoticeFromState({','serviceHistoryLoadedSinceLabel(_servicosCarregadoDesde)','servicesTableState({','applyServicesTableState({','filterAndSortServices({','serviceRowFromData({','badgeClass: statusBadge(s.status)','descriptionHtml: escapeHtmlSimples','workTypesHtml: _tiposTrabalhoBadgesHTML','const tableState =','const tbOS =','prepareServiceRow({',"_aplicarFiltroOrdenacao('servicos'","_getTableState('servicos')",'servicos.sort(','_toolbarHtml(','servicos.length === 0','Sem resultados para essa pesquisa.',"new Date(_servicosCarregadoDesde + 'T00:00:00')",'statusControl({','serviceStatusControl({','const statusHtml =','const podeEditar =','workSheetActions({','rowLeadingCells({','rowActions({','serviceRow({','leadingCells: {','tbOS.innerHTML = tableState.toolbarHtml','tbody.innerHTML = tableState.emptyRowsHtml','empty.style.display = tableState.emptyDisplay','const folhaOS =','const btnCriarFolha =']:
              assert block.count(item) == 0, (item, block.count(item))
          assert block.count('const rowData = prepareRow(s);') == 1
          for item in ['invoiceTOId:','invoiceMoloniId:','invoiceMoloniUrl:','receiptMoloniUrl:','guideMoloniId:','guideMoloniUrl:','creditNoteMoloniId:','creditNoteMoloniUrl:']:
              assert block.count(item) == 1, (item, block.count(item))
          assert "const CACHE = 'totalgest-v145';" in Path('sw.js').read_text(encoding='utf-8')
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
