name: Inspect cliente save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar ramo cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'cliente') {\n")
          end = text.index("            } else if (ent === 'servico') {\n", start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in ['dados.clientes', 'usuarioLogado', 'document.getElementById', 'alert(', 'return;', 'obj =', 'lista =']:
              print(token, block.count(token))
          PY
