name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos extraídos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')

          marker='        function renderizarServicos() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); services=text[s:e]
          for item in ['createServicesRuntimeState({','createServicesAreaRendererFromDocument({','renderServicesArea(runtimeState.selectionState)','buildActions: (s, rowData) => ({']:
              assert services.count(item)==1,(item,services.count(item))
          for item in ['invoiceTOId:','invoiceMoloniId:','invoiceMoloniUrl:','receiptMoloniUrl:','guideMoloniId:','guideMoloniUrl:','creditNoteMoloniId:','creditNoteMoloniUrl:']:
              assert services.count(item)==1,(item,services.count(item))

          render_marker='        function renderizarPonto() {'
          rs=text.index(render_marker); re=text.index('\n        function ',rs+len(render_marker)); render=text[rs:re]
          for item in ['buildLongWorkAttendanceRecords(','selectRecentAttendanceRecords(registros, {','selectAttendanceNavigationRecords(','groupAttendanceByPerson(registrosHoje)','attendanceLateLimit(_horaEsperada, _tolerMin)','attendancePhotoHtml(r.foto)','attendanceGpsHtml(r.lat, r.lng)','attendanceGpsHtml(r.latSaida, r.lngSaida)','attendanceDateCell(r.data, _pontoNavModo)','attendanceRecordRow({','attendanceAccordionItem({','attendanceAlertsHtml({','attendancePersonSummaryHtml({','attendanceEditTitle(r, escapeHtmlSimples)','attendanceEntryExitHtml(r, tituloEdicao)','preparePersonAttendanceRecords(porPessoa[fid])','calculateGeneralAttendanceState(regsGeral, agoraHM, calcularHoras)','applyAttendanceLunchDeduction(regsPessoa, {','isAttendanceBelowEightHours(geral, geralAberto, horasGeral)','isAttendanceLate({']:
              assert render.count(item)==1,(item,render.count(item))
          for item in ["(dados.obraPontoLonga || []).map(x => {","const _registrosSemana = registros.filter(p =>","const porPessoa = {};","const _limiteAtraso = (() =>",'const cabecalho = `<div class="ponto-acc-sub-row"','return `<div class="ponto-acc-sub-row">','const fotoHtml = r.foto ?','const gpsEntradaHtml = (r.lat && r.lng) ?','const alertaHtml = (menosDe8h ?','let resumoGeral;','const foiEditado = !!(r.editadoPor && r.editadoEm);','const saidaTxtBase = r.pausaAlmoco ?',"const regsPessoa = porPessoa[fid].sort((a, b) =>","const regsGeral = regsPessoa.filter(r => !r.servicoId && !r.obraId)",'regsGeral.forEach(r => {','const temPausaGeral = regsPessoa.some(r => r.pausaAlmoco && r.saida);','const atrasado = _ausenciaHoje ? false :','guardarDados(dados)']:
              assert render.count(item)==0,(item,render.count(item))
          assert render.count('const _ausenciaHoje = _funcionarioAusenteEm(fid, _hojeSoP);')==1
          assert render.index('isAttendanceBelowEightHours(') < render.index('const _ausenciaHoje = _funcionarioAusenteEm(fid, _hojeSoP);') < render.index('isAttendanceLate({')
          assert render.count('atualizarEstadoPonto();')==1
          assert render.count('renderizarResumoPontoAdmin();')==1

          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function startOfWeekMonday(','function formatHours(','function teamSummaryRow(','function teamSummaryCard(','function moveNavigationDate(','function canNavigateAttendance(','function attendanceNavigationLabel(','function isAttendanceNextDisabled(','function buildLongWorkAttendanceRecords(','function selectRecentAttendanceRecords(','function selectAttendanceNavigationRecords(','function groupAttendanceByPerson(','function attendanceLateLimit(','function attendancePhotoHtml(','function attendanceGpsHtml(','function attendanceDateCell(','function attendanceRecordRow(','function attendanceAccordionItem(','function attendanceAlertsHtml(','function attendancePersonSummaryHtml(','function attendanceEditTitle(','function attendanceEntryExitHtml(','function preparePersonAttendanceRecords(','function calculateGeneralAttendanceState(','function applyAttendanceLunchDeduction(','function isAttendanceBelowEightHours(','function isAttendanceLate(','window.TotalGestAttendanceView = {']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          shell=Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          assert shell.count("attendanceView: './assets/js/app-attendance-view.js'")==1
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert sw.count("'./assets/js/app-attendance-view.js'")==1
          assert "const CACHE = 'totalgest-v156';" in sw
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
