name: Migrate services table state

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Extrair filtro, ordenação, toolbar e estado vazio
        run: |
          echo '' | base64 -d > /tmp/migrate-services-table.py
          python3 /tmp/migrate-services-table.py
          rm /tmp/migrate-services-table.py
      - name: Testes unitários dos helpers
        run: |
          echo '' | base64 -d > /tmp/test-services-table.js
          node /tmp/test-services-table.js
          rm /tmp/test-services-table.js
      - name: Validação sintática e estrutural
        run: |
          node --check assets/js/app-services-selection.js
          node --check assets/js/app-services-view.js
          node --check sw.js
          echo '' | base64 -d > /tmp/validate-services-table.py
          python3 /tmp/validate-services-table.py
          rm /tmp/validate-services-table.py
          git diff --check
      - name: Restaurar workflow manual
        run: |
          echo '' | base64 -d > .github/workflows/inspect-exact-demo-plan.yml
      - name: Validar cleanup e commit
        run: |
          echo '' | base64 -d > /tmp/validate-cleanup.py
          python3 /tmp/validate-cleanup.py
          rm /tmp/validate-cleanup.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-services-selection.js assets/js/app-services-view.js sw.js .github/workflows/inspect-exact-demo-plan.yml
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Extrair estado da tabela de serviços"
          git push origin HEAD:refactor/separar-index-app
