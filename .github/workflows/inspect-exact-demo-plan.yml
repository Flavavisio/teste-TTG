name: Inspect final servico save branch

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar ramo final do serviço
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'servico') {")
          end = text.index("            } else if (ent === 'folha') {", start)
          block = text[start:end]
          print(block)
          print('\n=== linhas ===', len(block.splitlines()))
          print('=== contagens ===')
          for token in [
              'TotalGestSaveFormServicoValidation.validate({',
              'TotalGestSaveFormServicoContext.prepare({',
              'TotalGestSaveFormServicoObject.prepare({',
              'TotalGestSaveFormServicoConflicts.validate({',
              'TotalGestSaveFormServicoRegistration.apply({',
              'document.getElementById(', 'dados.', 'alert(', 'confirm(',
              '_tenantId(', 'gerarId(', '_horaMin(', 'obterNomeFuncionario(',
              'gerarNumeroRegistoServidor(', 'guardarDados(', 'renderizarTudo(',
              'fecharModal(', 'setTimeout(', 'await '
          ]:
              print(token, block.count(token))
          PY
