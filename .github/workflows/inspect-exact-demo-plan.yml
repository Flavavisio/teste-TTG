name: Migrate pending changes counter

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Extrair contador de alterações pendentes
        run: python3 .github/scripts/migrate-sync-pending.py
      - name: Validar JavaScript
        run: |
          node --check assets/js/app-sync-pending.js
          node --check assets/js/app-shell.js
          node --check sw.js
      - name: Validar e gravar
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/migrate-sync-pending.py
          git add app.html assets/js/app-sync-pending.js assets/js/app-shell.js sw.js .github/scripts/migrate-sync-pending.py
          git diff --cached --check
          git commit -m "Extrair contador de alterações pendentes"
          git push origin HEAD:refactor/separar-index-app
