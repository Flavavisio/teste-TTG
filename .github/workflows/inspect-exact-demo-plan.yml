name: Audit app remaining functions

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Audit largest functions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          starts=[]
          for m in re.finditer(r'(?m)^\s{8}function\s+([A-Za-z0-9_$]+)\s*\(', text):
              starts.append((m.start(),m.group(1)))
          rows=[]
          for i,(s,name) in enumerate(starts):
              e=starts[i+1][0] if i+1<len(starts) else len(text)
              chunk=text[s:e]
              rows.append((len(chunk),chunk.count('\n')+1,name,s))
          rows.sort(reverse=True)
          print('APP_CHARS=',len(text)); print('TOP_FUNCTIONS')
          for chars,lines,name,s in rows[:35]:
              flags=[]
              for word,label in [('supabase','SUPABASE'),('auth','AUTH'),('moloni','ERP'),('fatura','BILLING'),('storage','STORAGE')]:
                  if word in text[s:s+chars].lower(): flags.append(label)
              print(f'{chars:6d} chars | {lines:4d} lines | {name} | {",".join(flags) or "SAFE?"}')
          print('AUDIT_OK')
          PY
