name: Inspect services table boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar fronteira de renderizarServicos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start_marker = '        function renderizarServicos() {'
          assert text.count(start_marker) == 1, text.count(start_marker)
          s = text.index(start_marker)
          e = text.index('\n        function ', s + len(start_marker))
          block = text[s:e]
          print('BEGIN_RENDERIZAR_SERVICOS')
          print(block)
          print('END_RENDERIZAR_SERVICOS')
          for marker in [
              "_aplicarFiltroOrdenacao('servicos'",
              'servicosToolbar',
              '_toolbarHtml(',
              'servicos.length === 0',
              'TotalGestServicesSelection',
              'TotalGestServicesView'
          ]:
              print(f'MARKER {marker!r}: {block.count(marker)}')
          print('SERVICES_SELECTION_INCLUDE_INDEX=', text.find('assets/js/app-services-selection.js'))
          print('SERVICES_VIEW_INCLUDE_INDEX=', text.find('assets/js/app-services-view.js'))
          sw = Path('sw.js').read_text(encoding='utf-8')
          print('CACHE_V135=', "const CACHE = 'totalgest-v135';" in sw)
          PY
