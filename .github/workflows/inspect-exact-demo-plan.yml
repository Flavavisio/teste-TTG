name: Audit next app hotspot

on:
  push:
    branches:
      - refactor/separar-index-app
    paths:
      - '.github/workflows/inspect-exact-demo-plan.yml'
      - '.github/scripts/audit-next-hotspot.py'

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Auditar hotspots
        run: python3 .github/scripts/audit-next-hotspot.py
