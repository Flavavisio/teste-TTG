name: Inspect folha save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar folha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'folha') {\n")
          end = text.index("            } else if (ent === 'requisicao') {\n", start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in ['dados.', 'guardarDados(', 'assinatura', 'consum', 'gerarId()', 'mostrarErro(', 'document.getElementById', 'renderizarTudo(', 'fecharModal(']:
              print(token, block.count(token))
          PY
