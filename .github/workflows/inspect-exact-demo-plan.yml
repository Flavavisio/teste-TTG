name: Inspect snapshot boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear snapshots locais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          terms = ['_snap', '_snapLic', '_snapJunc', '_reconstruirSnapshots', '_restaurarSnapshotDaCache']
          for term in terms:
              hits = [i for i,l in enumerate(lines) if term in l]
              print(f'\n=== {term}: {len(hits)} ocorrência(s) ===')
              for i in hits:
                  print(f'{i+1}: {lines[i]}')
          print('\n=== CONTEXTO 2868-2925 ===')
          for i in range(2867, min(len(lines), 2925)):
              print(f'{i+1}: {lines[i]}')
          print('\n=== CONTEXTO RESTAURO CACHE ===')
          hits = [i for i,l in enumerate(lines) if '_restaurarSnapshotDaCache' in l]
          for i in hits:
              for j in range(max(0,i-12), min(len(lines),i+25)):
                  print(f'{j+1}: {lines[j]}')
          PY
