name: Inspect folha assist branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar integração Assist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('                // OS gerada a partir de uma Assistência (Total Gest Assist)')
          end = text.index('                _folhaConsumoPendente = Array.from(', start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in ['dados.servicos', 'dados.assistencias', 'fo_estado_assistencia', '_foAssistenciaParaAtualizar', '_foNovoEstadoAssistencia', 'alert(']:
              print(token, block.count(token))
          PY
