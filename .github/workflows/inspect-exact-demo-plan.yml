name: Migrate obra modal

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Extrair modal de obra
        run: python3 .github/scripts/migrate-modal-obra.py
      - name: Validar
        run: |
          node --check assets/js/app-modal-obra.js
          for f in assets/js/app-*.js; do node --check "$f"; done
          node --check sw.js
          git diff --check
      - name: Gravar migração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html assets/js/app-shell.js assets/js/app-modal-obra.js sw.js
          git commit -m 'Extrair formulário do modal de obra'
          git push origin HEAD:refactor/separar-index-app
