name: Apply tenth safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar décimo lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-10.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'), context);
          const view = context.window.TotalGestAttendanceView;
          const long = view.buildLongWorkAttendanceRecords([{id:'x',obraId:'o1'}],[{id:'o1',nome:'Obra A',clienteId:'c1'}]);
          assert.strictEqual(long.length,1);
          assert.strictEqual(long[0].obraDescricao,'Obra A');
          assert.strictEqual(long[0].clienteId,'c1');
          assert.strictEqual(long[0]._ehObraLonga,true);
          const records=[
            {id:'1',funcionarioId:'f1',data:'2026-09-02'},
            {id:'2',funcionarioId:'f1',data:'2026-08-31'},
            {id:'3',funcionarioId:'f2',data:'2026-08-20'}
          ];
          const period=view.selectRecentAttendanceRecords(records,{weekStart:new Date('2026-08-31T00:00:00'),recentStart:new Date('2026-08-01T00:00:00')});
          assert.strictEqual(period.weekRecords.length,2);
          assert.strictEqual(period.recentRecords.length,3);
          assert.strictEqual(view.selectAttendanceNavigationRecords(records,'2026-09-02','dia').length,1);
          assert.strictEqual(view.selectAttendanceNavigationRecords(records,'2026-09-02','semana').length,2);
          const grouped=view.groupAttendanceByPerson(records);
          assert.strictEqual(grouped.f1.length,2);
          assert.strictEqual(grouped.f2.length,1);
          assert.strictEqual(view.attendanceLateLimit('09:00',15),'09:15');
          console.log('SAFE_BATCH_10_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for item in ['buildLongWorkAttendanceRecords(','selectRecentAttendanceRecords(registros, {','selectAttendanceNavigationRecords(','groupAttendanceByPerson(registrosHoje)','attendanceLateLimit(_horaEsperada, _tolerMin)']:
              assert block.count(item)==1,(item,block.count(item))
          for item in ["(dados.obraPontoLonga || []).map(x => {","const _registrosSemana = registros.filter(p =>","const porPessoa = {};","const _limiteAtraso = (() =>"]:
              assert block.count(item)==0,(item,block.count(item))
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function buildLongWorkAttendanceRecords(','function selectRecentAttendanceRecords(','function selectAttendanceNavigationRecords(','function groupAttendanceByPerson(','function attendanceLateLimit(']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          assert "const CACHE = 'totalgest-v153';" in Path('sw.js').read_text(encoding='utf-8')
          print('SAFE_BATCH_10_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair preparação segura do registo de ponto"
          git push origin HEAD:refactor/separar-index-app
