name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos extraídos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')

          marker='        function renderizarServicos() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); services=text[s:e]
          for item in ['createServicesRuntimeState({','createServicesAreaRendererFromDocument({','renderServicesArea(runtimeState.selectionState)','buildActions: (s, rowData) => ({']:
              assert services.count(item)==1,(item,services.count(item))
          for item in ['invoiceTOId:','invoiceMoloniId:','invoiceMoloniUrl:','receiptMoloniUrl:','guideMoloniId:','guideMoloniUrl:','creditNoteMoloniId:','creditNoteMoloniUrl:']:
              assert services.count(item)==1,(item,services.count(item))

          for item in ['window.TotalGestAttendanceView.startOfWeekMonday()','window.TotalGestAttendanceView.formatHours(h)','window.TotalGestAttendanceView.teamSummaryRow({','window.TotalGestAttendanceView.teamSummaryCard({','window.TotalGestAttendanceView.moveNavigationDate({','window.TotalGestAttendanceView.canNavigateAttendance(_rNav)','window.TotalGestAttendanceView.attendanceNavigationLabel(_pontoNavData, _pontoNavModo)','window.TotalGestAttendanceView.isAttendanceNextDisabled(_pontoNavData, getDataHoje())']:
              assert text.count(item)==1,(item,text.count(item))

          render_marker='        function renderizarPonto() {'
          rs=text.index(render_marker); re=text.index('\n        function ',rs+len(render_marker)); render=text[rs:re]
          for item in ['buildLongWorkAttendanceRecords(','selectRecentAttendanceRecords(registros, {','selectAttendanceNavigationRecords(','groupAttendanceByPerson(registrosHoje)','attendanceLateLimit(_horaEsperada, _tolerMin)']:
              assert render.count(item)==1,(item,render.count(item))
          for item in ["(dados.obraPontoLonga || []).map(x => {","const _registrosSemana = registros.filter(p =>","const porPessoa = {};","const _limiteAtraso = (() =>",'guardarDados(dados)']:
              assert render.count(item)==0,(item,render.count(item))
          assert render.count('atualizarEstadoPonto();')==1
          assert render.count('renderizarResumoPontoAdmin();')==1

          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function startOfWeekMonday(','function formatHours(','function teamSummaryRow(','function teamSummaryCard(','function moveNavigationDate(','function canNavigateAttendance(','function attendanceNavigationLabel(','function isAttendanceNextDisabled(','function buildLongWorkAttendanceRecords(','function selectRecentAttendanceRecords(','function selectAttendanceNavigationRecords(','function groupAttendanceByPerson(','function attendanceLateLimit(','window.TotalGestAttendanceView = {']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          shell=Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          assert shell.count("attendanceView: './assets/js/app-attendance-view.js'")==1
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert sw.count("'./assets/js/app-attendance-view.js'")==1
          assert "const CACHE = 'totalgest-v153';" in sw
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
