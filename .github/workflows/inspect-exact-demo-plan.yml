name: Inspect obra modal boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar obra e fim de abrirModal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('app.html').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(lines) if "} else if (entidade === 'obra') {" in l and i>22000)
          print('obra start', start+1)
          for i in range(start,min(len(lines),start+180)):
              print(f'{i+1}: {lines[i]}')
          print('\n=== marcadores posteriores ===')
          for term in ['modalTitle','formFields','modalOverlay','_sIniciarTagsDescricao','onLocalObraChange']:
              hits=[i+1 for i,l in enumerate(lines[start:start+220],start) if term in l]
              print(term,hits)
          PY
