name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos principais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          checks = [
              'window.TotalGestApp.init',
              'function guardarDados()',
              'async function _sincronizar()',
              'function bootstrapSupabase()',
              'async function carregarDados(',
              'const FICHEIRO_CAMPOS = {',
              'async function uploadDataURL(dataUrl, pasta)',
              'function registarHistoricoLicenca(',
              'window.TotalGestModalFuncionario.render({',
              'window.TotalGestModalCliente.render({',
              'window.TotalGestModalFornecedor.render({',
              'window.TotalGestModalRequisicao.render({',
              'window.TotalGestModalArtigo.render({'
          ]
          for item in checks:
              print(item, text.count(item))
          PY
