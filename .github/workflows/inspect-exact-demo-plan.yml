name: Migrate load context

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Extrair contexto de carregamento
        run: python3 .github/scripts/migrate-load-context.py
      - name: Validar JavaScript
        run: |
          node --check assets/js/app-load-context.js
          node --check assets/js/app-shell.js
          node --check sw.js
      - name: Validar e gravar
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/migrate-load-context.py
          git add app.html assets/js/app-load-context.js assets/js/app-shell.js sw.js .github/scripts/migrate-load-context.py
          git diff --cached --check
          git commit -m "Extrair contexto do carregamento inicial"
          git push origin HEAD:refactor/separar-index-app
