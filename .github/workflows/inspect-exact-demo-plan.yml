name: Inspect fornecedor save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar fornecedor e fase comum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('app.html').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(lines) if "} else if (ent === 'fornecedor') {" in l)
          for i in range(start-8,start+90):
              print(f'{i+1}: {lines[i]}')
          PY
