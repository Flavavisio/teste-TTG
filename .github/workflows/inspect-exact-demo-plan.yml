name: Apply ninth safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar nono lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-9.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js', 'utf8'), context);
          const view = context.window.TotalGestAttendanceView;
          assert.strictEqual(view.moveNavigationDate({ value:'2026-09-02', direction:-1, mode:'dia', today:'2026-09-02' }), '2026-09-01');
          assert.strictEqual(view.moveNavigationDate({ value:'2026-09-02', direction:1, mode:'dia', today:'2026-09-02' }), null);
          assert.strictEqual(view.moveNavigationDate({ value:'2026-09-02', direction:-1, mode:'semana', today:'2026-09-02' }), '2026-08-26');
          assert.strictEqual(view.canNavigateAttendance('admin'), true);
          assert.strictEqual(view.canNavigateAttendance('vendedor'), true);
          assert.strictEqual(view.canNavigateAttendance('vigilante'), false);
          assert.strictEqual(view.attendanceNavigationLabel('2026-09-02', 'semana'), '31/8 a 6/9');
          assert(view.attendanceNavigationLabel('2026-09-02', 'dia').includes('02/09/2026'));
          assert.strictEqual(view.isAttendanceNextDisabled('2026-09-02', '2026-09-02'), true);
          assert.strictEqual(view.isAttendanceNextDisabled('2026-09-01', '2026-09-02'), false);
          console.log('SAFE_BATCH_9_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          for item in ['window.TotalGestAttendanceView.moveNavigationDate({','window.TotalGestAttendanceView.canNavigateAttendance(_rNav)','window.TotalGestAttendanceView.attendanceNavigationLabel(_pontoNavData, _pontoNavModo)','window.TotalGestAttendanceView.isAttendanceNextDisabled(_pontoNavData, getDataHoje())']:
              assert text.count(item)==1,(item,text.count(item))
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function moveNavigationDate(','function canNavigateAttendance(','function attendanceNavigationLabel(','function isAttendanceNextDisabled(']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const CACHE = 'totalgest-v152';" in sw
          print('SAFE_BATCH_9_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair navegação segura do registo de ponto"
          git push origin HEAD:refactor/separar-index-app
