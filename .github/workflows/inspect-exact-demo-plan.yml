name: Migrate reports headers view

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Migrar cabeçalhos visuais dos relatórios
        run: python3 .github/scripts/migrate-reports-headers-view.py
      - name: Validar migração
        run: |
          node --check assets/js/app-reports-view.js
          node --check sw.js
          git diff --check
          node <<'NODE'
          global.window = {};
          require('./assets/js/app-reports-view.js');
          const v = window.TotalGestReportsView;
          const sa = v.superadminHeader({ empresas: 3, empresasAtivas: 2, totalUtilizadores: 9, addonsAtivos: 4, expiramEm10Dias: 1, receitaRecorrente: 1234.5 });
          if (!sa.includes('Exportar PDF') || !sa.includes('Empresas') || !sa.includes('2 ativas') || !sa.includes('Receita recorrente') || !sa.includes('€')) throw new Error('superadminHeader');
          const dist = v.distributorHeader({ clientes: 5, clientesAtivos: 4 });
          if (!dist.includes('Clientes') || !dist.includes('5') || !dist.includes('4 ativos')) throw new Error('distributorHeader');
          console.log('REPORTS_HEADERS_VIEW_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          start = app.index('        function renderizarReports() {')
          end = app.index('\n        function ', start + 1)
          reports = app[start:end]
          assert reports.count('window.TotalGestReportsView.superadminHeader({') == 1
          assert reports.count('window.TotalGestReportsView.distributorHeader({') == 1
          assert reports.count('window.TotalGestReportsSuperadminMetrics.calculateCompanySummary({') == 1
          assert reports.count('window.TotalGestReportsDistributorMetrics.calculateClientSummary({') == 1
          assert reports.count('window.TotalGestReportsDistributorMetrics.calculateAdminOverview({') == 1
          assert 'const _kpi = window.TotalGestReportsView.kpi;' not in reports
          assert "const CACHE = 'totalgest-v121';" in sw
          assert app.count('bootstrapSupabase()') > 0
          print('REPORTS_HEADERS_VIEW_VALIDATION=OK')
          PY
      - name: Commit da migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html assets/js/app-reports-view.js sw.js
          git commit -m "Extrair cabeçalhos visuais dos relatórios"
          git push origin refactor/separar-index-app
