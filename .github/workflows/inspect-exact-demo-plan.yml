name: Inspect remaining save form

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar salvar formulário restante
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('        async function _salvarFormularioInterno() {')
          end = text.index('        function salvarFormulario()', start)
          block = text[start:end]
          print(block)
          print('\n=== linhas ===', len(block.splitlines()))
          print('=== ramos ===')
          for ent in ['funcionario','cliente','servico','folha','requisicao','fornecedor','artigo','obra']:
              print(ent, block.count("ent === '%s'" % ent))
          print('=== chamadas ===')
          for token in [
              'TotalGestSaveFormFuncionarioOrchestrator.run({',
              'TotalGestSaveFormCliente.prepare({',
              'TotalGestSaveFormServico.run({',
              'TotalGestSaveFormFolha.run({',
              'TotalGestSaveFormRequisicao.run({',
              'TotalGestSaveFormFornecedor.run({',
              'TotalGestSaveFormArtigo.run({',
              'TotalGestSaveFormObra.run({',
              'guardarDados(', 'renderizarTudo(', 'fecharModal(',
              'lista =', 'obj =', 'dados[', '_guardarArmazem(',
              'setTimeout(', 'await '
          ]:
              print(token, block.count(token))
          PY
