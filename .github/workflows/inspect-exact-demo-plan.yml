name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos principais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          checks = [
              'window.TotalGestSaveFormContactValidation.validate({',
              'window.TotalGestSaveFormFuncionarioOrchestrator.run({',
              'window.TotalGestSaveFormCliente.prepare({',
              'window.TotalGestSaveFormServico.run({',
              'window.TotalGestSaveFormFolha.run({',
              'window.TotalGestSaveFormPersist.apply({',
              'window.TotalGestSaveFormFinalize.run({',
              'window.TotalGestSaveFormAuth.run({',
              'function guardarDados()',
              'async function _sincronizar()',
              'async function carregarDados('
          ]
          for item in checks:
              print(item, text.count(item))
          PY
