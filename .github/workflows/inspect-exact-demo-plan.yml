name: Apply validated services table migration

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 2
      - name: Reutilizar scripts já validados
        run: |
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          from pathlib import Path

          old = subprocess.check_output([
              'git', 'show', 'HEAD^:.github/workflows/inspect-exact-demo-plan.yml'
          ], text=True)
          targets = {
              '/tmp/migrate-services-table.py': 'migrate-services-table.py',
              '/tmp/test-services-table.js': 'test-services-table.js',
              '/tmp/validate-services-table.py': 'validate-services-table.py',
          }
          for target, marker in targets.items():
              matches = re.findall(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d > /tmp/" + re.escape(marker), old)
              assert len(matches) == 1, (marker, len(matches))
              Path(target).write_bytes(base64.b64decode(matches[0]))
          PY
          python3 /tmp/migrate-services-table.py
          node /tmp/test-services-table.js
          node --check assets/js/app-services-selection.js
          node --check assets/js/app-services-view.js
          node --check sw.js
          python3 /tmp/validate-services-table.py
          rm /tmp/migrate-services-table.py /tmp/test-services-table.js /tmp/validate-services-table.py
          git diff --check
      - name: Commit apenas dos ficheiros funcionais
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-services-selection.js assets/js/app-services-view.js sw.js
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Extrair estado da tabela de serviços"
          git push origin HEAD:refactor/separar-index-app
