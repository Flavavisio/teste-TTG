name: Migrate reports revenue summary

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - run: python3 .github/scripts/migrate-reports-revenue-summary.py
      - run: |
          node --check assets/js/app-reports-superadmin-metrics.js
          for f in assets/js/app-*.js; do node --check "$f"; done
          node --check sw.js
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html assets/js/app-reports-superadmin-metrics.js sw.js
          git commit -m 'Extrair resumo de receita dos relatórios'
          git push origin HEAD:refactor/separar-index-app
