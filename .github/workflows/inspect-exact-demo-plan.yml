name: Migrate save-form dispatch

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Extrair dispatcher dos formulários
        run: python3 .github/scripts/migrate-save-form-dispatch.py
      - name: Validar
        run: |
          node --check assets/js/app-save-form-dispatch.js
          for f in assets/js/app-*.js; do node --check "$f"; done
          node --check sw.js
          git diff --check
      - name: Limpar script temporário
        run: rm -f .github/scripts/migrate-save-form-dispatch.py
      - name: Gravar migração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extrair dispatcher de gravação dos formulários'
          git push origin HEAD:refactor/separar-index-app
