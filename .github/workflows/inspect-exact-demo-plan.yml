name: Inspect profile distributor branch

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear ramo distribuidor do perfil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          fn = text.index('        function abrirEditarPerfil() {')
          start = text.index("            } else if (usuarioLogado.role === 'admin' && adminAtual()?.ehDistribuidor) {", fn)
          end = text.index("            } else if (usuarioLogado.role === 'admin' || usuarioLogado.role === 'subadmin') {", start)
          block = text[start:end]
          print('linhas_distribuidor', block.count('\n') + 1)
          print(block)
          for token in ['campos.innerHTML', 'dados.', 'usuarioLogado', 'obterConfig(', 'adminAtual(', 'document.', 'onclick=', 'onchange=']:
              print(token, block.count(token))
          PY
