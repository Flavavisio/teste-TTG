name: Inspect exact demo plan

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mostrar apenas linhas demo_30
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if 'demo_30' in line or ("'mensal'" in line and 'dias' in line):
                  print('HIT', i + 1, repr(line))
                  for n in range(max(0, i - 2), min(len(lines), i + 3)):
                      print(n + 1, repr(lines[n]))
                  print('---')
          PY
