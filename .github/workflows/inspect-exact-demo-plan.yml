name: Inspect profile admin tail

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar fim exato do perfil admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          fn = text.index('        function abrirEditarPerfil() {')
          start = text.index("            } else if (usuarioLogado.role === 'admin' || usuarioLogado.role === 'subadmin') {", fn)
          pos = text.index('perf_contrato_modo_wizard', start)
          print('CONTEXT_REPR=', repr(text[pos:pos+1200]))
          print('BEFORE_REPR=', repr(text[pos-300:pos]))
          PY
