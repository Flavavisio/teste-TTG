name: Apply alerts safe batch 27

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrate and validate alerts fleet
        run: |
          python3 scripts/tmp-migrate-alerts-safe-batch-27.py
          node --check assets/js/app-alerts-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const c={window:{}}; vm.createContext(c); vm.runInContext(fs.readFileSync('assets/js/app-alerts-view.js','utf8'),c); const v=c.window.TotalGestAlertsView;
          const st=(value)=> value==='bad'?{chave:'a_vencer',dias:7}:{chave:'ok',dias:90};
          const last=v.latestFleetMaintenance([{veiculoId:'v1',proximaData:'bad',data:'2026-01-01'},{veiculoId:'v1',proximaData:'bad',data:'2026-02-01'}],'v1'); assert.strictEqual(last.data,'2026-02-01');
          const item=v.fleetVehicleAttention({id:'v1',inspecaoValidade:'bad',seguroValidade:'ok'},[],st); assert.strictEqual(item.needsAttention,true); assert.ok(item.reasons.includes('inspeção')); assert.strictEqual(item.days,7);
          const prep=v.prepareFleetAttention({vehicles:[{id:'v1',adminId:'a1',inspecaoValidade:'bad',seguroValidade:'ok'}],interventions:[],adminId:'a1',getDateState:st}); assert.strictEqual(prep.items.length,1); assert.ok(prep.alert && prep.alert.acao.includes('frota'));
          console.log('SAFE_BATCH_27_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app.html').read_text()
          def block(marker):
              s=t.index(marker); e=t.index('\n        function ',s+len(marker)); return t[s:e]
          a=block('        function renderizarAlertas() {')
          assert a.count('prepareFleetAttention({')==1
          assert a.count("_notificarPorFaseVencimento('frota_vencer_")==1
          assert a.count("_notificarAdminESubadmin(adminId, '🚗 Veículo a vencer'")==1
          for x in ["_notificarPorFaseVencimento('contrato_vencer_", "_notificarPorFaseVencimento('licenca_", "_notificarPorFaseVencimento('registo_previo_", "_notificarPorFaseVencimento('anepc_", "_notificarPorFaseVencimento('shst_"]: assert a.count(x)==1,(x,a.count(x))
          assert "const CACHE = 'totalgest-v170';" in Path('sw.js').read_text()
          print('SAFE_BATCH_27_VERIFY=OK')
          PY
      - name: Commit functional alerts fleet
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-alerts-view.js sw.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair preparação segura da frota nos alertas"
          git push origin HEAD:refactor/separar-index-app
