name: Inspect next extraction candidates

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect next candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          lines=text.splitlines()
          names=['renderizarFerramentas','renderizarRelatorioPonto','_renderizarPontoRelatorio','_renderizarEscalasVisual','renderizarFornecedores','renderizarArtigos','renderizarObras']
          for name in names:
              markers=[f'        function {name}(',f'        async function {name}(']
              found=None
              for m in markers:
                  try:
                      s=text.index(m); found=m; break
                  except ValueError: pass
              if not found:
                  print(name,'NOT_FOUND'); continue
              starts=[]
              for pat in ['\n        function ','\n        async function ']:
                  p=text.find(pat,s+len(found))
                  if p!=-1: starts.append(p)
              e=min(starts) if starts else len(text)
              b=text[s:e]
              print(f'{name}: CHARS={len(b)} LINES={b.count(chr(10))+1}')
              print('  TOKENS:', {k:b.count(k) for k in ['supabase','fetch(','localStorage','_guardar','salvar','excluir','abrirModal','innerHTML','_aplicarFiltroOrdenacao','usuarioLogado','_tenantId()']})
          PY
