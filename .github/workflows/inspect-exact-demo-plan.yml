name: Fix reports access guard

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Corrigir guard de acesso dos relatórios
        run: python3 .github/scripts/fix-reports-access-guard.py
      - name: Validar hotfix
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          bad = "if (!usuarioLogado                container.innerHTML = html;"
          proper = "if (!usuarioLogado || usuarioLogado.role !== 'admin' && usuarioLogado.role !== 'subadmin') {"
          assert bad not in app
          assert app.count(proper) == 1
          assert app.count('function renderizarReports()') == 1
          assert app.count('window.TotalGestReportsView.superadminCompanySummary({') == 1
          assert app.count('window.TotalGestReportsView.distributorClientSummary({') == 1
          assert "const CACHE = 'totalgest-v116';" in sw
          print('REPORTS_ACCESS_GUARD_VALIDATION=OK')
          PY
      - name: Commit do hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git commit -m "Corrigir guard de acesso dos relatórios"
          git push origin refactor/separar-index-app
