name: Apply fifth safe services batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar quinto lote seguro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-migrate-services-safe-batch-5.py')
          text = path.read_text(encoding='utf-8')
          old = "'createServicesTableStateRenderer({','elements: viewElements','renderTableState(selectionState.totalCount, servicos.length)'"
          new = "'createServicesTableStateRenderer({','renderTableState(selectionState.totalCount, servicos.length)'"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          anchor = "for item in ['selectVisibleServicesFromData({','createServiceFilterSorter({','filterServices(servicos)'"
          assert text.count(anchor) == 1
          text = text.replace(anchor, "assert block.count('elements: viewElements') == 2, block.count('elements: viewElements')\n" + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/tmp-migrate-services-safe-batch-5.py
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-services-selection.js assets/js/app-services-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "Extrair quinta ronda segura da apresentação das OS"
          git push origin HEAD:refactor/separar-index-app
