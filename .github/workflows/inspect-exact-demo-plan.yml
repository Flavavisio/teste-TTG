name: Inspect session protection

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear proteção de sessão
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          for term in ['_avisoSessaoMostrado', '_mostrarAvisoSessaoExpirada', '_trocandoConta', '_fetchOriginalTG', 'onAuthStateChange']:
              hits=[i for i,l in enumerate(lines) if term in l]
              print(f'\n=== {term}: {len(hits)} ===')
              for i in hits:
                  print(f'{i+1}: {lines[i]}')
          print('\n=== BLOCO 2433-2465 ===')
          for i in range(2432, 2465):
              print(f'{i+1}: {lines[i]}')
          PY
