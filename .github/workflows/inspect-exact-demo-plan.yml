name: Audit services next boundary
on:
  push:
    branches: [refactor/separar-index-app]
    paths: ['.github/workflows/inspect-exact-demo-plan.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: refactor/separar-index-app }
      - run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
          python3 .github/scripts/audit-services-next-after-row-actions.py
