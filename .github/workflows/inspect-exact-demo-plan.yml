name: Inspect remaining save form

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear fronteira do salvar formulário
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('app.html').read_text(encoding='utf-8')
          start_token = 'async function _salvarFormularioInterno('
          start = text.index(start_token)
          print('start pos', start)
          for token in ['function salvarFormulario(', 'async function salvarFormulario(', 'function _guardarArmazem(', 'function fecharModal(', 'function abrirModal(']:
              positions = [m.start() for m in re.finditer(re.escape(token), text)]
              print(token, positions[:10])
          print('\n=== próximas funções ===')
          tail = text[start:start + 120000]
          found = 0
          for m in re.finditer(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(', tail):
              print(m.start(), m.group(1))
              found += 1
              if found >= 12: break
          print('\n=== últimos 2500 chars da janela ===')
          print(tail[-2500:])
          PY
