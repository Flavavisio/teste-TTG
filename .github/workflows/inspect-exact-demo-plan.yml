name: Migrate inline branding

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 1
      - run: python3 scripts/migrate-branding.py
      - run: git diff --check
      - name: Gravar remoção validada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Remover branding inline da aplicação'
          git push origin HEAD:refactor/separar-index-app
