name: Inspect alerts domain separation

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect current alerts orchestration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          s=text.index('        function renderizarAlertas() {')
          e=text.index('\n        function ', s+10)
          block=text[s:e]
          print('ALERTS_CHARS=',len(block))
          print('ALERTS_LINES=',block.count('\n')+1)
          print('---ALERTS_START---')
          print(block)
          print('---ALERTS_END---')
          PY
