name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos extraídos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarServicos() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for item in ['createServicesRuntimeState({','createServicesAreaRendererFromDocument({','renderDependencies: runtimeState.renderDependencies','renderServicesArea(runtimeState.selectionState)','buildActions: (s, rowData) => ({']:
              assert block.count(item)==1,(item,block.count(item))
          for item in ['invoiceTOId:','invoiceMoloniId:','invoiceMoloniUrl:','receiptMoloniUrl:','guideMoloniId:','guideMoloniUrl:','creditNoteMoloniId:','creditNoteMoloniUrl:']:
              assert block.count(item)==1,(item,block.count(item))

          for item in ['window.TotalGestAttendanceView.startOfWeekMonday()','window.TotalGestAttendanceView.formatHours(h)','window.TotalGestAttendanceView.teamSummaryRow({','window.TotalGestAttendanceView.teamSummaryCard({','window.TotalGestAttendanceView.moveNavigationDate({','window.TotalGestAttendanceView.canNavigateAttendance(_rNav)','window.TotalGestAttendanceView.attendanceNavigationLabel(_pontoNavData, _pontoNavModo)','window.TotalGestAttendanceView.isAttendanceNextDisabled(_pontoNavData, getDataHoje())']:
              assert text.count(item)==1,(item,text.count(item))

          point_marker='        function renderizarResumoPontoAdmin() {'
          ps=text.index(point_marker); pe=text.index('\n        // ---------- Navegador de picagens',ps); point=text[ps:pe]
          for item in ['const contaParaTotal = x => x._ehObraLonga || (!x.servicoId && !x.obraId);','if (x.entrada && x.saida) horasHoje += calcularHoras(x.entrada, x.saida);','if (x.entrada && x.saida) horasSemana += calcularHoras(x.entrada, x.saida);','const naApp = p.atividade && (Date.now() - p.atividade) < LIMITE_ONLINE_MS;']:
              assert point.count(item)==1,(item,point.count(item))

          render_marker='        function renderizarPonto() {'
          rs=text.index(render_marker); re=text.index('\n        function ',rs+len(render_marker)); render=text[rs:re]
          for item in ['atualizarEstadoPonto();','renderizarResumoPontoAdmin();','guardarDados(dados)']:
              if item != 'guardarDados(dados)': assert render.count(item)==1,(item,render.count(item))
          assert render.count('guardarDados(dados)')==0

          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function startOfWeekMonday(','function formatHours(','function teamSummaryRow(','function teamSummaryCard(','function moveNavigationDate(','function canNavigateAttendance(','function attendanceNavigationLabel(','function isAttendanceNextDisabled(','window.TotalGestAttendanceView = {']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          shell=Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          assert shell.count("attendanceView: './assets/js/app-attendance-view.js'")==1
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert sw.count("'./assets/js/app-attendance-view.js'")==1
          assert "const CACHE = 'totalgest-v152';" in sw
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
