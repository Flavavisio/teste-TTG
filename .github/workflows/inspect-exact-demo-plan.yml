name: Inspect folha ponto branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar acesso a ponto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'folha') {")
          end = text.index("            } else if (ent === 'requisicao') {", start)
          block = text[start:end]
          lines = block.splitlines()
          for i, line in enumerate(lines):
              if 'dados.ponto' in line:
                  a=max(0,i-12); b=min(len(lines),i+18)
                  print('\n'.join(lines[a:b]))
          PY
