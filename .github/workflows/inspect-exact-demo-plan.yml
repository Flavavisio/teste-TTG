name: Repair load orchestrator boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 0
      - name: Restaurar bloco removido pela fronteira larga
        run: python3 .github/scripts/repair-load-orchestrator-boundary.py
      - name: Validar
        run: |
          node --check assets/js/app-load-orchestrator.js
          node --check assets/js/app-shell.js
          node --check sw.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          checks = [
              'async function carregarDados(',
              'window.TotalGestLoadOrchestrator.run({',
              'const FICHEIRO_CAMPOS = {',
              'async function uploadDataURL(dataUrl, pasta)',
              'function registarHistoricoLicenca(',
              'function registarAuditoria('
          ]
          for token in checks:
              count = text.count(token)
              print(token, count)
              if count != 1:
                  raise SystemExit(1)
          PY
      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/repair-load-orchestrator-boundary.py
          git add app.html .github/scripts/repair-load-orchestrator-boundary.py
          git diff --cached --check
          git commit -m "Corrigir fronteira da orquestração de carregamento"
          git push origin HEAD:refactor/separar-index-app
