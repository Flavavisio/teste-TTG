name: Inspect connectivity boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear estado online offline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          patterns = ('function mostrarStatusOffline', 'function _atualizarIndicadorLigacao', "addEventListener('offline'", "addEventListener('online'", 'setInterval(_atualizarIndicadorLigacao', 'mostrarStatusOffline()')
          hits = []
          for i, line in enumerate(lines):
              if any(p in line for p in patterns):
                  hits.append(i)
          for i in hits:
              print('HIT', i + 1, repr(lines[i]))
              for n in range(max(0, i - 10), min(len(lines), i + 18)):
                  print(n + 1, repr(lines[n]))
              print('---')
          PY
