name: Audit reports summary tables

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar tabelas de resumo dos relatórios
        run: python3 .github/scripts/audit-reports-tables.py
