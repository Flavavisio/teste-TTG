name: Locate stock requisitions renderer

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Locate requisitions stock functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          for i,line in enumerate(text.splitlines(),1):
              low=line.lower()
              if ('function ' in line or 'renderizar' in low) and ('requis' in low or ('stock' in low and 'render' in low)):
                  print(f'{i}: {line}')
          for needle in ['tabelaRequisicoesStock','emptyRequisicoesStock','requisicoesStock','requisicoes_stock','stockRequisicoes']:
              print('---',needle,'---')
              for i,line in enumerate(text.splitlines(),1):
                  if needle in line:
                      print(f'{i}: {line}')
          PY
