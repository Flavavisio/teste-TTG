name: Apply validated services table migration

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 6
      - name: Reutilizar scripts já validados
        run: |
          python3 - <<'PY'
          import base64
          import subprocess
          from pathlib import Path

          revisions = subprocess.check_output([
              'git', 'rev-list', '--max-count=6', 'HEAD'
          ], text=True).splitlines()
          old = None
          source_rev = None
          required = (
              '> /tmp/migrate-services-table.py',
              '> /tmp/test-services-table.js',
              '> /tmp/validate-services-table.py',
          )
          for rev in revisions:
              candidate = subprocess.check_output([
                  'git', 'show', f'{rev}:.github/workflows/inspect-exact-demo-plan.yml'
              ], text=True)
              if all(marker in candidate for marker in required):
                  old = candidate
                  source_rev = rev
                  break
          assert old is not None, revisions
          print('VALIDATED_SCRIPT_SOURCE=', source_rev)

          targets = {
              '/tmp/migrate-services-table.py': 'migrate-services-table.py',
              '/tmp/test-services-table.js': 'test-services-table.js',
              '/tmp/validate-services-table.py': 'validate-services-table.py',
          }
          for target, marker in targets.items():
              lines = [line for line in old.splitlines() if "echo '" in line and f'> /tmp/{marker}' in line]
              assert len(lines) == 1, (marker, len(lines))
              payload = lines[0].split("echo '", 1)[1].split("' | base64 -d", 1)[0]
              assert payload, marker
              decoded = base64.b64decode(payload)
              assert len(decoded) > 100, (marker, len(decoded))
              Path(target).write_bytes(decoded)
          PY
          python3 /tmp/migrate-services-table.py
          node /tmp/test-services-table.js
          node --check assets/js/app-services-selection.js
          node --check assets/js/app-services-view.js
          node --check sw.js
          python3 /tmp/validate-services-table.py
          rm /tmp/migrate-services-table.py /tmp/test-services-table.js /tmp/validate-services-table.py
          git diff --check
      - name: Commit apenas dos ficheiros funcionais
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-services-selection.js assets/js/app-services-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "Extrair estado da tabela de serviços"
          git push origin HEAD:refactor/separar-index-app
