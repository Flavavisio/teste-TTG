name: Inspect remaining funcionario branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar ramo funcionário
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          s = text.index("            if (ent === 'funcionario') {\n")
          e = text.index("            } else if (ent === 'cliente') {\n", s)
          block = text[s:e]
          print(block)
          print('\n=== contagens ===')
          for token in ['window.TotalGestSaveFormFuncionario.prepare({', 'window.TotalGestSaveFormFuncionarioEncarregado.run({', 'guardarDados(', 'dados.encarregados.push', 'emailJaRegistado(', 'verificarLimiteFuncionarios(', 'mostrarErro(', 'document.']:
              print(token, block.count(token))
          PY
