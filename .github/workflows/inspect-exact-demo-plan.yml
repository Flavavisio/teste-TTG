name: Inspect reports renderer

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - run: python3 .github/scripts/inspect-reports.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/renderizarReports.txt
          git diff --cached --quiet || git commit -m 'Diagnosticar renderizador de relatórios'
          git diff --cached --quiet || git push origin HEAD:refactor/separar-index-app
