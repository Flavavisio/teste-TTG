name: Inspect tools domain boundary

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect tools exact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarFerramentas() {'
          s=text.index(marker)
          starts=[]
          for pat in ['\n        function ','\n        async function ']:
              p=text.find(pat,s+len(marker))
              if p!=-1: starts.append(p)
          b=text[s:min(starts)]
          print('TOOLS_CHARS=',len(b)); print('TOOLS_LINES=',b.count('\n')+1)
          print('---TOOLS_START---'); print(b); print('---TOOLS_END---')
          PY
