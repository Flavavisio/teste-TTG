name: Inspect save form branches

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear ramos de gravação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('app.html').read_text(encoding='utf-8').splitlines()
          s=next(i for i,l in enumerate(lines) if 'function _salvarFormularioInterno(' in l)
          d=0; started=False; e=None
          for j in range(s,len(lines)):
              x=lines[j]
              if '{' in x: started=True
              d += x.count('{')-x.count('}')
              if started and d==0:
                  e=j; break
          print(f'function: {s+1}-{e+1} ({e-s+1} linhas)')
          for i in range(s,e+1):
              if re.search(r"\bent\s*===\s*['\"]", lines[i]) or re.search(r"\bent\s*!==\s*['\"]", lines[i]):
                  print(f'{i+1}: {lines[i].strip()}')
          PY
