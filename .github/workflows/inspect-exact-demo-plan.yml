name: Inspect requisicao save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar requisição
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'requisicao') {\n")
          end = text.index("            } else if (ent === 'fornecedor') {\n", start)
          print(text[start:end])
          PY
