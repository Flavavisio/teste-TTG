name: Inspect remaining servico save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar restante do serviço
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'servico') {\n")
          end = text.index("            } else if (ent === 'folha') {\n", start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in [
              'TotalGestSaveFormServicoValidation.validate({',
              'dados.', 'document.getElementById(', 'alert(', 'mostrarErro(',
              'gerarId(', 'getDataHoje(', '_notificarFuncionario(',
              'guardarDados(', 'renderizarTudo(', 'fecharModal(',
              'setTimeout(', 'await ', 'lista =', 'obj ='
          ]:
              print(token, block.count(token))
          PY
