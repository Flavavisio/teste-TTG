name: Migrate license presentation phase 2

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Migrar apresentação restante da licença
        run: python3 .github/scripts/migrate-license-presentation-phase2.py
      - name: Validar migração
        run: |
          node --check assets/js/app-license-addons.js
          node --check sw.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.html sw.js "
          node <<'NODE'
          global.window = {};
          require('./assets/js/app-license-addons.js');
          const v = window.TotalGestLicenseAddons;
          if (!v.renderNoLicense().includes('Sem licença atribuída')) throw new Error('no-license');
          if (!v.renderErpComingSoon().includes('Integração com ERP')) throw new Error('erp');
          const pending = v.renderBaseAction({ pending:true, pendingPlanLabel:'Profissional' });
          if (!pending.includes('Pedido de licença enviado') || !pending.includes('Profissional')) throw new Error('base-pending');
          const demo = v.renderBaseAction({ demo:true });
          if (!demo.includes('Plano Demo') || !demo.includes('Adquirir Licença')) throw new Error('base-demo');
          const active = v.renderBaseAction({ remainingDays:5 });
          if (!active.includes('Pedir Renovação') || !active.includes('Alterar Plano')) throw new Error('base-active');
          const joint = v.renderJointRequest({ items:[{label:'Frota',value:10},{label:'CRM',value:20}] });
          if (!joint.includes('Frota') || !joint.includes('CRM') || !joint.includes('30.00 €')) throw new Error('joint');
          if (v.renderJointRequest({items:[{label:'Frota',value:10}]}) !== '') throw new Error('joint-single');
          if (!v.renderActivateAddons({visible:true}).includes('Ativar Add-ons')) throw new Error('addons-visible');
          if (v.renderActivateAddons({visible:false}) !== '') throw new Error('addons-hidden');
          const cancellation = v.renderCancellation({pending:true,signatureName:'Ana',signatureDate:'01/09/2026'});
          if (!cancellation.includes('Ana') || !cancellation.includes('01/09/2026')) throw new Error('cancel-pending');
          if (!v.renderCancellation({pending:false}).includes('Encerrar Acordo')) throw new Error('cancel-action');
          const page = v.renderLicensePage({name:'Admin',erpHtml:'ERP_SENTINEL'});
          if (!page.includes('ERP_SENTINEL')) throw new Error('erp-slot');
          console.log('LICENSE_PRESENTATION_PHASE2_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          start = app.index('        function renderizarMinhaLicenca() {')
          end = app.index('\n        function ', start + 1)
          block = app[start:end]
          expected = [
              'window.TotalGestLicenseAddons.renderNoLicense()',
              'window.TotalGestLicenseAddons.renderErpComingSoon()',
              'window.TotalGestLicenseAddons.renderBaseAction({',
              'window.TotalGestLicenseAddons.renderJointRequest({',
              'window.TotalGestLicenseAddons.renderActivateAddons({',
              'window.TotalGestLicenseAddons.renderCancellation({',
              'window.TotalGestLicenseAddons.renderLicensePage({'
          ]
          for item in expected: assert block.count(item) == 1, (item, block.count(item))
          assert block.count('window.TotalGestLicenseAddons.renderAddon({') == 4
          assert block.count('window.TotalGestLicenseAddons.renderRounds({') == 1
          for old in ['Sem licença atribuída', "Integração com ERP's", 'Resumo do pedido conjunto', 'Ativar Add-ons</button>', 'Encerrar Acordo com a Total Gest', 'Plano Demo.']:
              assert old not in block, old
          assert 'erpHtml: erpBloco,' in block
          assert "const CACHE = 'totalgest-v126';" in sw
          print('LICENSE_PRESENTATION_PHASE2_VALIDATION=OK')
          PY
      - name: Commit da migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git commit -m "Extrair apresentação restante da licença"
          git push origin refactor/separar-index-app
