name: Migrate brand theme

on:
  push:
    branches:
      - refactor/separar-index-app
    paths:
      - '.github/scripts/migrate-brand-theme.py'
      - '.github/workflows/inspect-exact-demo-plan.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Ativar tema de marca
        run: python3 .github/scripts/migrate-brand-theme.py
      - name: Validar tema
        run: |
          node --check assets/js/index.js
          node --check assets/js/app-ui.js
          node --check sw.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          index_js = Path('assets/js/index.js').read_text(encoding='utf-8')
          app_ui = Path('assets/js/app-ui.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          theme = Path('assets/css/brand-theme.css').read_text(encoding='utf-8')
          assert theme.count('#243B8F') >= 2
          assert theme.count('#FFF0C9') >= 2
          assert index_js.count("link.href = './assets/css/brand-theme.css';") == 1
          assert app_ui.count("link.href = './assets/css/brand-theme.css';") == 1
          assert sw.count("'./assets/css/brand-theme.css',") == 1
          assert "const CACHE = 'totalgest-v122';" in sw
          print('BRAND_THEME_VALIDATION=OK')
          PY
      - name: Commit do tema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/index.js assets/js/app-ui.js sw.js
          git commit -m "Ativar tema Blueberry e Cream Soda"
          git push origin refactor/separar-index-app
