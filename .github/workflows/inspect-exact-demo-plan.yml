name: Inspect period loading

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear carregamento por períodos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          terms = [
              '_dataCorteMeses',
              '_pontoCarregadoDesde',
              'garantirPontoCarregado',
              '_servicosCarregadoDesde',
              'garantirServicosCarregados',
              '_folhasCarregadoDesde',
              'garantirFolhasCarregadas'
          ]
          for term in terms:
              hits = [i for i,l in enumerate(lines) if term in l]
              print(f'\n=== {term}: {len(hits)} ===')
              for i in hits:
                  print(f'{i+1}: {lines[i]}')
          print('\n=== BLOCO 2895-2995 ===')
          for i in range(2894, min(len(lines),2995)):
              print(f'{i+1}: {lines[i]}')
          PY
