name: Audit services row boundary

on:
  push:
    branches:
      - refactor/separar-index-app
    paths:
      - '.github/scripts/audit-services-row.py'
      - '.github/workflows/inspect-exact-demo-plan.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Auditar linha dos serviços
        run: python3 .github/scripts/audit-services-row.py
