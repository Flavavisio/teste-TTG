name: Audit folha save branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar ramo folha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'folha') {")
          end = text.index("            } else if (ent === 'requisicao') {", start)
          block = text[start:end]
          print('linhas', len(block.splitlines()))
          for token in ['window.TotalGestSaveFormFolha', 'dados.', 'document.getElementById', 'guardarDados(', 'gerarId(', 'alert(', '_notificarFuncionario(', 'avancarPeriodicidade(', '_uploadImagemStorage(', 'capturarAssinatura(', '_horasPicadas']:
              print(token, block.count(token))
          print('\n=== ramo atual ===')
          print(block)
          PY
