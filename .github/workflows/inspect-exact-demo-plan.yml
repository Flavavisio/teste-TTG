name: Inspect collaborators domain boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect renderizarColaboradores exact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarColaboradores() {'
          s=text.index(marker)
          e=text.index('\n        function ',s+len(marker))
          block=text[s:e]
          print('COLLABORATORS_CHARS=',len(block))
          print('COLLABORATORS_LINES=',block.count('\n')+1)
          print('---COLLABORATORS_START---')
          print(block)
          print('---COLLABORATORS_END---')
          PY
