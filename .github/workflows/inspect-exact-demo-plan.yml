name: Apply fifteenth safe attendance batch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Migrar e validar décimo quinto lote seguro
        run: |
          python3 scripts/tmp-migrate-attendance-safe-batch-15.py
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const context={window:{}}; vm.createContext(context);
          vm.runInContext(fs.readFileSync('assets/js/app-attendance-view.js','utf8'),context);
          const v=context.window.TotalGestAttendanceView;
          assert.strictEqual(v.shouldIncludeMissingAttendancePeople({selectedDate:'2026-09-02',today:'2026-09-02',role:'admin',nowTime:'09:30',lateLimit:'09:15'}),true);
          assert.strictEqual(v.shouldIncludeMissingAttendancePeople({selectedDate:'2026-09-01',today:'2026-09-02',role:'admin',nowTime:'09:30',lateLimit:'09:15'}),false);
          assert.strictEqual(v.shouldIncludeMissingAttendancePeople({selectedDate:'2026-09-02',today:'2026-09-02',role:'funcionario',nowTime:'09:30',lateLimit:'09:15'}),false);
          const ids=v.eligibleAttendancePersonIds([
            {id:'f1',adminId:'t1',role:'funcionario',suspenso:false},
            {id:'f2',adminId:'t1',role:'admin',suspenso:false},
            {id:'f3',adminId:'t1',role:'funcionario',suspenso:true},
            {id:'f4',adminId:'t2',role:'funcionario',suspenso:false}
          ],[
            {id:'e1',adminId:'t1',suspenso:false},
            {id:'e2',adminId:'t1',suspenso:true}
          ],'t1');
          assert.deepStrictEqual(Array.from(ids),['f1','e1']);
          const grouped={f1:[{id:'r1'}]};
          const missing=v.missingAttendancePersonIds(grouped,['f1','e1']);
          assert.deepStrictEqual(Array.from(missing),['e1']);
          const same=v.addMissingAttendancePeople(grouped,missing);
          assert.strictEqual(same,grouped); assert.deepStrictEqual(Array.from(grouped.e1),[]);
          console.log('SAFE_BATCH_15_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          for item in ['shouldIncludeMissingAttendancePeople({','eligibleAttendancePersonIds(','missingAttendancePersonIds(porPessoa, _todosIds)','addMissingAttendancePeople(porPessoa, idsSemPicagem)']:
              assert block.count(item)==1,(item,block.count(item))
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function shouldIncludeMissingAttendancePeople(','function eligibleAttendancePersonIds(','function missingAttendancePersonIds(','function addMissingAttendancePeople(']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          assert "const CACHE = 'totalgest-v158';" in Path('sw.js').read_text(encoding='utf-8')
          print('SAFE_BATCH_15_VERIFY=OK')
          PY
      - name: Commit funcional
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html assets/js/app-attendance-view.js sw.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Extrair seleção segura de faltas de picagem"
          git push origin HEAD:refactor/separar-index-app
