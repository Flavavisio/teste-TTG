name: Inspect folha ponto branch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Localizar fecho de picagem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index("            } else if (ent === 'folha') {")
          end = text.index("            } else if (ent === 'requisicao') {", start)
          block = text[start:end]
          lines = block.splitlines()
          for i, line in enumerate(lines):
              low = line.lower()
              if 'picag' in low or 'datasaida' in low or 'horasaida' in low:
                  a=max(0,i-5); b=min(len(lines),i+9)
                  print('\n'.join(lines[a:b]))
                  print('---')
          print('dados.ponto', block.count('dados.ponto'))
          print('dataSaida', block.count('dataSaida'))
          print('horaSaida', block.count('horaSaida'))
          print('guardarDados(', block.count('guardarDados('))
          print('renderizar', block.count('renderizar'))
          PY
