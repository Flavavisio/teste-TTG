name: Inspect attendance round 20

on:
  push:
    branches: [refactor/separar-index-app]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect exact point block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          s=text.index('        function renderizarPonto() {')
          e=text.index('\n        function ',s+10)
          block=text[s:e]
          print('CHARS=',len(block)); print('LINES=',block.count('\n')+1)
          print(block)
          PY
