name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos principais
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          checks = [
              'window.TotalGestApp.init',
              'function guardarDados()',
              'function restaurarSessaoAuth()',
              'function bootstrapSupabase()'
          ]
          for item in checks:
              print(item, text.count(item))
          PY
