name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos principais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          checks = [
              'window.TotalGestDashboardCounts.calculateRoleCounts({',
              'window.TotalGestReportsDistributorMetrics.calculateAdminOperations({',
              'window.TotalGestReportsDistributorMetrics.calculateAdminContracts({',
              'window.TotalGestReportsDistributorMetrics.calculateAdminOverview({',
              'function atualizarContagens()',
              'function renderizarReports('
          ]
          for item in checks: print(item, text.count(item))
          PY
