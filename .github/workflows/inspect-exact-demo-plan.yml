name: Apply Quantum Blue and Ice Glass

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply brand palette
        run: |
          python3 scripts/tmp-quantum-ice-brand.py
          node --check sw.js
          git diff --check
      - name: Commit palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html login.html registar.html redefinir-password.html confirmar-trial.html assets/css/brand-theme.css assets/css/login.css assets/css/registar.css assets/css/redefinir-password.css sw.js
          git commit -m "Trocar identidade para Quantum Blue e Ice Glass"
          git push origin HEAD:main
