name: Migrate worker profile modal

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - run: python3 .github/scripts/migrate-profile-worker.py
      - run: |
          node --check assets/js/app-profile-modal-worker.js
          for f in assets/js/app-*.js; do node --check "$f"; done
          node --check sw.js
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html assets/js/app-shell.js assets/js/app-profile-modal-worker.js sw.js
          git commit -m 'Extrair perfil de funcionário e encarregado'
          git push origin HEAD:refactor/separar-index-app
      - run: echo 'worker-profile-migration'
