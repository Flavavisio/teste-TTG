name: Inspect app migration boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Estado dos módulos extraídos
        run: |
          node --check assets/js/app-attendance-view.js
          node --check sw.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          def block(marker):
              s=text.index(marker); e=text.index('\n        function ',s+len(marker)); return text[s:e]
          services=block('        function renderizarServicos() {')
          for item in ['createServicesRuntimeState({','createServicesAreaRendererFromDocument({','renderServicesArea(runtimeState.selectionState)','buildActions: (s, rowData) => ({']:
              assert services.count(item)==1,(item,services.count(item))
          for item in ['invoiceTOId:','invoiceMoloniId:','invoiceMoloniUrl:','receiptMoloniUrl:','guideMoloniId:','guideMoloniUrl:','creditNoteMoloniId:','creditNoteMoloniUrl:']:
              assert services.count(item)==1,(item,services.count(item))
          point=block('        function renderizarPonto() {')
          for item in ['buildLongWorkAttendanceRecords(','selectRecentAttendanceRecords(registros, {','selectAttendanceNavigationRecords(','groupAttendanceByPerson(registrosHoje)','attendanceLateLimit(_horaEsperada, _tolerMin)','shouldIncludeMissingAttendancePeople({','eligibleAttendancePersonIds(','missingAttendancePersonIds(porPessoa, _todosIds)','addMissingAttendancePeople(porPessoa, idsSemPicagem)','prepareAttendanceAccordionPerson(porPessoa[fid], {','attendanceAccordionItem({']:
              assert point.count(item)==1,(item,point.count(item))
          assert point.count('const _ausenciaHoje = _funcionarioAusenteEm(fid, _hojeSoP);')==1
          for old in ['preparePersonAttendanceRecords(porPessoa[fid])','calculateGeneralAttendanceState(regsGeral, agoraHM, calcularHoras)','applyAttendanceLunchDeduction(regsPessoa, {','attendanceAlertsHtml({','attendancePersonSummaryHtml({','prepareAttendanceRecordRow(r, {','guardarDados(dados)']:
              assert old not in point, old
          assert point.count('atualizarEstadoPonto();')==1
          assert point.count('renderizarResumoPontoAdmin();')==1
          attendance=Path('assets/js/app-attendance-view.js').read_text(encoding='utf-8')
          for item in ['function prepareAttendancePersonState(','function attendancePersonPresentation(','function attendancePersonRows(','function prepareAttendanceAccordionPerson(','function shouldIncludeMissingAttendancePeople(','function eligibleAttendancePersonIds(','function missingAttendancePersonIds(','function addMissingAttendancePeople(','window.TotalGestAttendanceView = {']:
              assert attendance.count(item)==1,(item,attendance.count(item))
          shell=Path('assets/js/app-shell.js').read_text(encoding='utf-8')
          assert shell.count("attendanceView: './assets/js/app-attendance-view.js'")==1
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert sw.count("'./assets/js/app-attendance-view.js'")==1
          assert "const CACHE = 'totalgest-v159';" in sw
          print('APP_MIGRATION_BOUNDARY=OK')
          PY
