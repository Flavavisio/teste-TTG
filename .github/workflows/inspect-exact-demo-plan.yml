name: Inspect team domain boundary

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspect employees and managers exact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          def block(marker):
              s=text.index(marker)
              e=text.index('\n        function ',s+len(marker))
              return text[s:e]
          for marker,label in [('        function renderizarFuncionarios() {','EMPLOYEES'),('        function renderizarEncarregados() {','MANAGERS')]:
              b=block(marker)
              print(label+'_CHARS=',len(b))
              print(label+'_LINES=',b.count('\n')+1)
              print('---'+label+'_START---')
              print(b)
              print('---'+label+'_END---')
          PY
