name: Migrate superadmin company aggregation

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Confirmar branch e HEAD
        run: |
          test "$(git branch --show-current)" = "refactor/separar-index-app"
          git rev-parse HEAD
      - name: Migrar agregação das empresas do superadmin
        run: python3 .github/scripts/audit-current-hotspots.py
      - name: Validar migração
        run: |
          node --check assets/js/app-reports-superadmin-metrics.js
          node --check assets/js/app-reports-view.js
          node --check sw.js
          git diff --check
          node <<'NODE'
          global.window = {};
          require('./assets/js/app-reports-superadmin-metrics.js');
          const summary = window.TotalGestReportsSuperadminMetrics.calculateCompanySummary({
            admins: [
              { id: 'a1', nome: 'A', empresa: 'EA', ativo: true, licenca: { plano: 'p1', maxFuncionarios: 2 }, contratosPlano: 'mensal' },
              { id: 'a2', nome: 'B', empresa: 'EB', ativo: true, licenca: { plano: 'p2', maxFuncionarios: 5 }, frotaPlano: 'anual' }
            ],
            data: {
              funcionarios: [
                { adminId: 'a1', role: 'funcionario' },
                { adminId: 'a1', role: 'funcionario' },
                { adminId: 'a2', role: 'funcionario' }
              ],
              encarregados: [{ adminId: 'a1' }]
            },
            baseValueCharged: () => 100,
            contractsActive: a => a.id === 'a1',
            fleetActive: a => a.id === 'a2',
            warehouseActive: () => false,
            crmActive: () => false,
            erpActive: () => false,
            roundsActive: () => false,
            contractsAnnualPrice: 20,
            contractsMonthlyPrice: 10,
            fleetAnnualPrice: 30,
            fleetMonthlyPrice: 15,
            warehouseAnnualPrice: 0,
            warehouseMonthlyPrice: 0,
            crmAnnualPrice: 0,
            crmMonthlyPrice: 0,
            erpAnnualPrice: 0,
            erpMonthlyPrice: 0,
            roundsAnnualPrice: 0,
            roundsMonthlyPrice: 0,
            planLabel: a => 'Plano ' + a.licenca.plano,
            expiryLabel: a => a.id === 'a1' ? '01/01/2030' : '02/01/2030'
          });
          if (summary.rows.length !== 2) throw new Error('rows');
          if (summary.rows[0].rowClass !== 'tr-limite-atingido') throw new Error('limit');
          if (summary.totals.funcionarios !== 3) throw new Error('funcionarios');
          if (summary.totals.encarregados !== 1) throw new Error('encarregados');
          if (summary.totals.contratos !== 1 || summary.totals.frota !== 1) throw new Error('modules');
          if (summary.totals.receita !== 240) throw new Error('receita ' + summary.totals.receita);
          console.log('SUPERADMIN_COMPANY_SUMMARY_UNIT=OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          start = app.index('        function renderizarReports() {')
          end = app.index('\n        function ', start + 1)
          reports = app[start:end]
          assert reports.count('window.TotalGestReportsSuperadminMetrics.calculateCompanySummary({') == 1
          assert reports.count('window.TotalGestReportsView.superadminCompanySummary(_companySummary)') == 1
          assert 'const _companyRows = [];' not in reports
          assert 'totalReceitaGlobal' not in reports
          assert 'window.TotalGestReportsSuperadminMetrics.calculateCompany({' not in reports
          assert "const CACHE = 'totalgest-v119';" in sw
          assert app.count('bootstrapSupabase()') > 0
          print('SUPERADMIN_COMPANY_SUMMARY_VALIDATION=OK')
          PY
      - name: Commit da migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git commit -m "Extrair agregação das empresas do superadmin"
          git push origin refactor/separar-index-app
