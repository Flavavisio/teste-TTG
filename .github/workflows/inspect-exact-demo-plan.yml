name: Apply brand and prepare deploy

on:
  push:
    branches:
      - refactor/separar-index-app

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Apply brand theme everywhere
        run: |
          python3 scripts/tmp-apply-brand-deploy.py
          git diff --check
          grep -q 'assets/css/brand-theme.css' index.html
          grep -q 'assets/css/brand-theme.css' app.html
          grep -q '#243B8F' assets/css/login.css
          grep -q '#243B8F' assets/css/registar.css
          grep -q '#243B8F' assets/css/redefinir-password.css
          grep -q "const CACHE = 'totalgest-v180';" sw.js
      - name: Commit brand application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.html login.html registar.html redefinir-password.html confirmar-trial.html assets/css/login.css assets/css/registar.css assets/css/redefinir-password.css sw.js
          git diff --cached --check
          git commit -m "Aplicar cores de marca em todo o acesso"
          git push origin HEAD:refactor/separar-index-app
