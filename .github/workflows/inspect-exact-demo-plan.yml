name: Inspect save-form common tail

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Localizar tail comum de gravação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          for token in ['_salvarFormularioInterno', 'function salvarFormulario', 'TotalGestSaveFormPersist.apply', 'TotalGestSaveFormServico.run', 'TotalGestSaveFormServicoNotifications.run']:
              positions = []
              pos = 0
              while True:
                  i = text.find(token, pos)
                  if i < 0: break
                  positions.append(i)
                  pos = i + 1
              print(token, positions)
          start = text.find('_salvarFormularioInterno')
          persist = text.find('TotalGestSaveFormPersist.apply', start)
          if start >= 0 and persist >= 0:
              end = text.find('\n        }', persist)
              if end < 0: end = persist + 8000
              print('\n=== contexto ===')
              print(text[max(0, start-300):min(len(text), end+1200)])
          PY
          echo 'auditoria-tail-estrutural'
