name: Inspect save-form common tail

on:
  push:
    branches: [refactor/separar-index-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Auditar tail comum de gravação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          start = text.index('        async function _salvarFormularioInterno()')
          end = text.index('        function salvarFormulario(', start)
          block = text[start:end]
          print(block)
          print('\n=== contagens ===')
          for token in [
              "ent === 'servico'",
              'window.TotalGestSaveFormServico.run({',
              'window.TotalGestSaveFormPersist.apply({',
              'window.TotalGestSaveFormServicoNotifications.run({',
              'guardarDados(', 'fecharModal(', 'renderizarTudo(',
              'dados.servicos', 'dados.funcionarios', 'dados.clientes', 'dados.folhasObra',
              '_folhaConsumoPendente', '_guardarConsumoFolha', '_sincronizar'
          ]:
              print(token, block.count(token))
          PY
          echo 'auditoria-tail-comum'
