name: Inspect pending changes counter

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear contador de alterações pendentes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          hits = [i for i,l in enumerate(lines) if '_contarAlteracoesPendentes' in l]
          print('ocorrencias:', len(hits))
          for i in hits:
              print(f'\n=== linha {i+1} ===')
              for j in range(max(0,i-8), min(len(lines),i+20)):
                  print(f'{j+1}: {lines[j]}')
          PY
