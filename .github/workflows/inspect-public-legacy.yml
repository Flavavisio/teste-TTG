name: Inspect public legacy code

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear componentes comerciais públicos restantes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('app.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          needles = [
              'tg-addon-overlay',
              'abrirDetalheAddon',
              'fecharDetalheAddon',
              'tg-signup-overlay',
              'abrirModalSignup',
              'submeterSignup',
              'tg-calc-wizard-overlay',
              'abrirWizardCalc',
              'fecharWizardCalc',
              'tgCalcularPoupanca',
              'tgc_func',
              'TCW_ADDONS',
              'TCW_ESCALOES',
              '_tcwPasso',
              'registar-visita',
              'atualizarLanding()'
          ]
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle.lower() in line.lower()]
              print(f'\n===== {needle}: {len(hits)} hit(s) =====')
              for i in hits[:40]:
                  lo = max(0, i - 12)
                  hi = min(len(lines), i + 24)
                  print(f'--- {lo+1}-{hi} / hit {i+1} ---')
                  for n in range(lo, hi):
                      line = re.sub(r'eyJ[A-Za-z0-9_.-]{20,}', '[JWT_REDACTED]', lines[n])
                      print(f'{n+1:06d}: {line}')
          PY
