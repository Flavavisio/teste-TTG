name: Inspect public legacy code

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mostrar fronteiras exatas dos blocos públicos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          for start, end in [(32215, 32425), (32580, 32740)]:
              print(f'\n===== LINES {start}-{end} =====')
              for n in range(start - 1, min(end, len(lines))):
                  line = re.sub(r'eyJ[A-Za-z0-9_.-]{20,}', '[JWT_REDACTED]', lines[n])
                  print(f'{n+1:06d}: {line}')
          PY
