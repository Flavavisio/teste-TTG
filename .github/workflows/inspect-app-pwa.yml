name: Inspect app PWA block

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear bloco PWA inline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('app.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          needles = [
              'serviceWorker.register',
              'updatefound',
              '_mostrarAvisoNovaVersao',
              '_atualizarParaNovaVersao',
              'beforeinstallprompt',
              '_pwaBannerFoiDispensadoRecentemente',
              '_pwaInstalar',
              'appinstalled'
          ]

          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {len(hits)} hit(s) =====')
              for i in hits:
                  lo = max(0, i - 14)
                  hi = min(len(lines), i + 20)
                  print(f'--- context lines {lo+1}-{hi} (hit {i+1}) ---')
                  for n in range(lo, hi):
                      print(f'{n+1:06d}: {lines[n]}')

          print('\n===== script boundaries around first serviceWorker.register =====')
          hit = next((i for i,l in enumerate(lines) if 'serviceWorker.register' in l), None)
          if hit is not None:
              prev_script = max((i for i in range(hit, -1, -1) if '<script' in lines[i]), default=None)
              next_script = next((i for i in range(hit, len(lines)) if '</script>' in lines[i]), None)
              print('prev_script_line=', None if prev_script is None else prev_script+1)
              print('next_script_line=', None if next_script is None else next_script+1)
          PY
