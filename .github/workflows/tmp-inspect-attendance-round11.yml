name: Inspect attendance round 11

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Inspecionar composição visual de renderizarPonto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.html').read_text(encoding='utf-8')
          marker='        function renderizarPonto() {'
          s=text.index(marker); e=text.index('\n        function ',s+len(marker)); block=text[s:e]
          tokens=['const alertaHtml =','const resumoGeral =','const corpo = regsPessoa.map','const cabecalho =','return `<div class="ponto-acc-item"','const fotoHtml =','const gpsEntradaHtml =','const dataHtml =']
          for token in tokens:
              pos=block.find(token)
              if pos>=0:
                  print('\nTOKEN',token)
                  print(block[max(0,pos-900):min(len(block),pos+5200)])
          print('CHARS',len(block),'LINES',block.count('\n')+1)
          PY
