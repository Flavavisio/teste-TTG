name: Inspect auth boundaries

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear autenticação e landing legadas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('app.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          needles = [
              'async function restaurarSessaoAuth',
              'function restaurarSessaoAuth',
              'onAuthStateChange',
              'tg-landing',
              'tg-entrar',
              'loginLanding',
              'function login(',
              'function logout',
              'usuarioLogado',
              'mostrarApp',
              'esconderApp',
              'atualizarLanding',
              'bootstrapSupabase'
          ]

          shown = set()
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle.lower() in line.lower()]
              print(f'\n===== {needle}: {len(hits)} hit(s) =====')
              for i in hits[:20]:
                  lo = max(0, i - 18)
                  hi = min(len(lines), i + 45)
                  key = (lo, hi)
                  if key in shown:
                      continue
                  shown.add(key)
                  print(f'--- context lines {lo+1}-{hi} (hit {i+1}) ---')
                  for n in range(lo, hi):
                      line = re.sub(r'eyJ[A-Za-z0-9_\-.]{20,}', '[JWT_REDACTED]', lines[n])
                      print(f'{n+1:06d}: {line}')
          PY
