name: Refactor app shell patch

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
          fetch-depth: 0

      - name: Aplicar patch mínimo ao app.html
        shell: bash
        run: |
          set -euo pipefail
          atual="$(git hash-object app.html)"
          esperado="3f5725fba91bf8b8409109e6c8e4a8facfd0d752"
          if [ "$atual" != "$esperado" ]; then
            echo "app.html já mudou: $atual (esperado $esperado). A abortar sem alterações."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.html')
          data = path.read_bytes()
          newline = b'\r\n' if data.count(b'\r\n') > data.count(b'\n') / 2 else b'\n'

          meta = b'<meta name="robots" content="noindex,nofollow">'
          shell = b'<script src="./assets/js/app-shell.js"></script>'

          if meta in data:
              raise SystemExit('meta robots já existe; a abortar para revisão manual')
          if shell in data:
              raise SystemExit('app-shell.js já está ligado; a abortar para revisão manual')

          head_pos = data.find(b'</head>')
          body_pos = data.rfind(b'</body>')
          if head_pos < 0 or body_pos < 0 or head_pos > 200_000 or body_pos < 1_000_000:
              raise SystemExit(f'limites HTML inesperados: head={head_pos}, body={body_pos}')

          data = data[:head_pos] + b'  ' + meta + newline + data[head_pos:]
          body_pos = data.rfind(b'</body>')
          data = data[:body_pos] + b'  ' + shell + newline + data[body_pos:]
          path.write_bytes(data)
          PY

          git diff --check -- app.html
          test "$(git diff --numstat -- app.html | awk '{print $1}')" -le 2
          test "$(git diff --numstat -- app.html | awk '{print $2}')" -eq 0
          grep -q '<meta name="robots" content="noindex,nofollow">' app.html
          grep -q '<script src="./assets/js/app-shell.js"></script>' app.html

      - name: Gravar alteração isolada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Ligar shell modular ao app sem alterar arranque"
          git push origin HEAD:refactor/separar-index-app
