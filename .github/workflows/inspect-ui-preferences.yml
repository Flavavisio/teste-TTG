name: Inspect UI preferences

on:
  push:
    branches:
      - refactor/separar-index-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/separar-index-app
      - name: Mapear tema sidebar e zoom
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('app.html').read_text(encoding='utf-8').splitlines()
          needles = [
              'function alternarTema',
              'function alternarSidebarEncolhida',
              'function _aplicarSidebarEncolhidaGuardada',
              'const _NIVEIS_ZOOM',
              'function alternarZoom',
              'function _aplicarZoom(',
              'function _aplicarZoomGuardado',
              'function _aplicarTemaGuardado',
              'function bootstrapSupabase',
              'async function bootstrapSupabase',
              'alternarTema()',
              'alternarSidebarEncolhida()',
              'alternarZoom()'
          ]
          shown = set()
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {len(hits)} hit(s) =====')
              for i in hits[:30]:
                  lo = max(0, i - 14)
                  hi = min(len(lines), i + 38)
                  key = (lo, hi)
                  if key in shown:
                      continue
                  shown.add(key)
                  print(f'--- {lo+1}-{hi} / hit {i+1} ---')
                  for n in range(lo, hi):
                      line = re.sub(r'eyJ[A-Za-z0-9_.-]{20,}', '[JWT_REDACTED]', lines[n])
                      print(f'{n+1:06d}: {line}')
          PY
